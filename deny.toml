# cargo-deny 自动化开源许可与依赖安全审计配置
#
# 规范来源 (Normative): docs/YEBAN_ENGINEERING_IMPLEMENTATION_ROADMAP.md ROAD-M-1-002
# AGENTS.md §2 红线 2 (依赖许可红线), MUST-GATE-004 (cargo-deny 100% 通过)
#
# 配置格式已按 cargo-deny 0.20.x 校准 (2026-10-05 核对官方 cfg 文档 + 首次 CI 实测):
#   - [advisories] 的 `vulnerability` / `unsound` / `notice` 字段已**移除**, 保留即报错;
#     所有漏洞/不健全公告现在一律 error, 需要豁免只能写进 `ignore`。
#   - [licenses] 的 `unlicensed` / `deny` / `copyleft` / `allow-osi-fsf-free` / `default`
#     字段已**移除**, 保留即报错; 未在 `allow` 中的许可一律拒绝。
#   - GNU 系许可自 0.18.4 起按字面严格匹配: 允许 "GPL-3.0" 不等于允许 "GPL-3.0-only"。
#
# ⚠ TOML 表是有位置的: 一旦写了 `[licenses.private]`, 它**之后**的键就都属于它。
#   首次 CI 运行就栽在这里 —— `unused-allowed-license` 与 `allow` 被误放进
#   `[licenses.private]`, cargo-deny 报 `found 2 unexpected keys`。
#   规则: 子表一律放在所属父表的**所有标量键之后**。见 docs/DEVELOPMENT_LEDGER.md 第 6 节。

[advisories]
# unmaintained = "workspace": 只有当**直接依赖**无人维护时才失败。
# 直接对应 RSK-35 (nih-plug maintenance mode) —— 引入 nih-plug 时会被此处拦下。
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.8
# 白名单之外一律拒绝。GNU 系按字面匹配, 因此 GPL-3.0 / GPL-3.0-only / GPL-3.0-or-later
# 三者都要显式列出 (本项目自身以 GPL-3.0-only + §7 CLAP 例外发布)。
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "GPL-3.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "MPL-2.0",
    "CC0-1.0",
    "CC-BY-4.0",
    "OFL-1.1",
    # BSL-1.0 (Boost Software License 1.0): OSI 认证 + FSF Free/Libre + 宽松 + GPLv3 兼容
    # (无任何额外限制)。它由 clipboard-win / error-code 引入, 来源链路是
    # arboard(剪贴板) <- winit/slint, 且仅在 Windows 目标上参与编译。
    # 不属于 AGENTS.md §2 红线 2 禁止的"非商业限制/专有不可再分发/与 GPLv3 不兼容"任何一类。
    "BSL-1.0",
    # Unlicense: OSI 认证 + FSF Free/Libre + 公有领域等效奉献 + 与 GPLv3 兼容(无额外限制)。
    # 来源是 midly —— 规范 §4 指定的 SMF 0/1 零堆分配编解码库。它**只有** Unlicense,
    # 不像多数 crate 那样带 MIT/Apache 兜底分支, 所以必须显式列出(否则被逐条拒绝)。
    # 同样是 Proposed 状态, 见 docs/adr/ADR-0001 D20。
    "Unlicense",
]
# 注意: CC-BY-NC-* / CC-Sampling-Plus / 任何"非商业"或"不可再分发"许可**永远不进白名单**
# [AGENTS.md §2 红线 2]。历史项目 groove 的采样清单曾主动接受 CC-BY-NC —— 绝不移植
# (docs/ledger/legacy-reuse-audit.md 第 5 节)。

# workspace 成员自身不检查许可表达式: 本项目为 "GPL-3.0-only + GPLv3 §7 CLAP 例外",
# 该 §7 附加许可没有对应 SPDX 标识符, 由根 LICENSE 文本承载。
# 子表必须放在 [licenses] 的标量键与数组之后 (见文件头的 TOML 位置警告)。
[licenses.private]
ignore = true

# 针对特定 crate 的精细化豁免规则 (目前仓库尚无 ring 依赖, 保留以备后续引入 TLS 时使用)
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# workspace **内部** path 依赖不写版本号是正当的: 成员一律 publish = false, 版本由
# [workspace.package] 统一继承, 写死 `version = "0.0.1"` 反而会在工作区升版时变成陷阱
# (^0.0.1 不匹配 0.1.0)。
# 若不豁免, 任何"成员依赖另一个成员"的写法都会被 `wildcards = "deny"` 拦下 —— 而 Phase 2/3
# 的几乎每条工作线都要这么写(engine→dsp、render→model/dsp、app→ui-test-port…), 会变成
# 一根卡住所有线的独木桥。该豁免**只**放行带 `path` 的 `*`; registry 依赖仍必须写真实版本。
# 见 docs/adr/ADR-0001 D21。
allow-wildcard-paths = true

# 明确禁用的高风险库
deny = [
    { name = "rubberband", reason = "商业付费/GPL双轨协议，已由宽松 MIT 的 signalsmith-stretch 替代" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
