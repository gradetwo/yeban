# 创作任务专用（一次性，⛔ 不落地 main）：
# 在 ubuntu-24.04-arm 上构建 **aarch64 + 形态 A/UI 控制面特性** 的 yeban-app 二进制并上传产物，
# 供本机 (linux/arm64) 直接运行 MCP 创作与 UI 注入创作。
# 特性开启方式合规：AGENTS.md §2 红线 6 允许 mcp-http / ui-mcp 在"特定开发或测试配置"中按需开启；
# 本 workflow 只在本分支手动派发，产物不进 release 通道。
name: Zimmer creative arm64 build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zimmer-creative-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_MIN_STACK: 16777216

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖（与 ci.yml 的 app 腿同集）
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev \
            libasound2-dev \
            clang libclang-dev \
            fonts-noto-cjk

      - name: 钉死工具链核验
        run: |
          set -euo pipefail
          rustup show
          want="$(grep -oE 'channel = "[^"]+"' rust-toolchain.toml | cut -d'"' -f2)"
          got="$(rustc --version | cut -d' ' -f2)"
          echo "pinned=$want actual=$got"
          [ "$want" = "$got" ] || { echo "::error::工具链漂移"; exit 1; }

      - name: 构建 release 二进制（in-process-mcp + ui-mcp-http）
        run: |
          set -euo pipefail
          cargo build --release --locked -p yeban-app --features in-process-mcp,ui-mcp-http
          mkdir -p dist
          cp target/release/yeban-app dist/
          rustc -V > dist/build-info.txt
          uname -m >> dist/build-info.txt
          git rev-parse HEAD >> dist/build-info.txt
          sha256sum dist/yeban-app > dist/SHA256SUMS
          ldd dist/yeban-app > dist/ldd.txt || true
          ./dist/yeban-app --help > dist/help.txt 2>&1 || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: yeban-app-aarch64-features
          path: dist/
          retention-days: 14
