# 夜半 (Yeban) 持续集成 —— 自动触发的主门禁
#
# 规范来源:
#   AGENTS.md §3 (DoD), docs/YEBAN_ENGINEERING_IMPLEMENTATION_ROADMAP.md §5 (质量门禁)
#   docs/DEV_WORKFLOW.md (本机只做编辑与轻量检查, 重活全部在 CI)
#
# 为什么 CI 是唯一的「绿」(docs/skills/yeban-dev-workflow/SKILL.md「Honesty rules」):
#   本地绿不是绿。本机是 M2 开发机, 不跑全量构建/重依赖/基准; 只有这里的判决算数,
#   而且必须用 `scripts/dev/ci-verdict.sh` 把判决读回来才算数 —— 没读的判决是 pending。

name: CI

on:
  push:
    branches:
      - main
      - "line/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_full:
        description: "忽略受影响集合推导, 强制跑全量门禁"
        type: boolean
        default: false

concurrency:
  # 同一分支的新推送取消旧运行 —— 多线并行时这是最省算力的一条规则
  # ⚠ main 上让**每次 run 自成一组**（带上 run_id）：否则同一分组里"只允许一个排队 run",
  # 连推或派发会互相顶掉 —— 实测 86c38fd / b73cab5 / 8eed2a0 三条 push run 与我自己派发的
  # 37329844372 全部 `completed cancelled`, 腿全空。分支上仍按老办法(refl+共享组)省算力。
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'shared' }}
  # ⚠ main 上**不**取消在飞 run: 实测最近 40 条 main run 里 workspace 腿有 10 条连续 cancelled,
  # 而其余 success 多为 docs-only(crate 腿 steps=0 skipped) ⇒ main 的重腿长期没有完成态判决,
  # 「绿」的集合里混进大量零 crate 证据的 success(「空心绿」的系统性版本)。
  # 分支上仍取消(省额度); main 上排队等它跑完。
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # ⚠ `RUST_MIN_STACK` 是**工作流级**的：本仓门禁脚本（scripts/dev/premerge-gate.sh:23）就设它，
  # 而 `yeban-app` 的部分测试在默认栈下会崩溃（Windows 与全量腿曾因此红，见台账 R707/R714）。
  # ⭐ 放工作流级而⛔ 不逐腿：CI 与本地门禁的**环境变量必须对齐**（第 215 条）。
  RUST_MIN_STACK: 16777216
  # ⭐ #172: app 的特性清单**单一事实源** —— 合并后的 clippy / test 两条特性腿都从这里取,
  # ⛔ 不在各腿里各写一份 (增删一个 feature 时两份必然漂移)。
  # 每个名字都必须是 `crates/yeban-app/Cargo.toml` 的 `[features]` 键:
  #   * `scripts/guards/check_workflow_structure.py` 把这份清单与 `Cargo.toml` **机械比对**
  #     (声明了却没进清单 ⇒ 红; 清单里有而 `Cargo.toml` 没有 ⇒ 红);
  #   * `scripts/dev/app-features.sh <crate>` 逐条对照 `crates/<crate>/Cargo.toml`,
  #     只把该 crate **真的声明了**的那些交给 `--features`。
  # 为什么是这 5 个而不是 app 声明的全部 7 个: 见该守卫的 `AUTO_CI_EXCLUDED`
  # (`ui-test-port` 由 dev-dependency + 自动发现的测试目标覆盖; `ui-mcp-http` 由手动档
  #  `gates-manual.yml` 的 `all-features` 覆盖)。
  APP_FEATURES: "experimental-als-export,experimental-logic-export,experimental-logic-import,in-process-mcp,midi-input"

jobs:
  # ---------------------------------------------------------------------------
  # 计划: 由改动文件推导受影响 crate (SKILL 规则 6 —— 用搜索得出, 不凭记忆)
  # ---------------------------------------------------------------------------
  plan:
    name: plan (受影响集合)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      crates: ${{ steps.plan.outputs.crates }}
      workspace_wide: ${{ steps.plan.outputs.workspace_wide }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 推导受影响 crate
        id: plan
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          FORCE_FULL: ${{ inputs.force_full }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "${FORCE_FULL:-false}" = "true" ]; then
            # 手动档要求真跑全量: 必须让**计划器**返回全部成员,
            # 而不是把 base 挪到 HEAD~1 (那样只会推导出"无受影响 crate"并把 rust 腿跳过)。
            EXTRA="--force-full"
          fi
          ZERO="0000000000000000000000000000000000000000"
          if [ -z "${BASE_SHA:-}" ] || [ "${BASE_SHA:-}" = "$ZERO" ]; then
            # 新分支的首次推送: github.event.before 是全零 sha (GitHub 的语义).
            # 不能因此放弃推导 —— 新分支总是从 main 切出来的, 所以拿 origin/main 当基线,
            # 这样只跑"这条线真正碰到的那一族", 而不是 23 个 crate 全跑一遍。
            git fetch --no-tags origin main
            BASE="origin/main"
          else
            BASE="$BASE_SHA"
          fi
          echo "diff base = $BASE  extra = ${EXTRA:-<none>}"
          # 首次推送时 github.event.before 是全零 sha; 脚本会保守回退全量。
          # 逻辑住在脚本里而不是这里, 因此它可以在本机被测 (SKILL 规则 3)。
          python3 scripts/dev/changed-crates.py --base "$BASE" --head HEAD $EXTRA --github-output

  # ---------------------------------------------------------------------------
  # 便宜且永远要跑的门禁: 格式 / 机械红线 / JSON Schema 契约
  # ---------------------------------------------------------------------------
  checks:
    name: checks (fmt / 红线守卫 / schema)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 安装钉死工具链 (单一事实源 rust-toolchain.toml)
        run: |
          set -euo pipefail
          rustup show
          want="$(grep -oE 'channel = "[^"]+"' rust-toolchain.toml | cut -d'"' -f2)"
          got="$(rustc --version | cut -d' ' -f2)"
          echo "pinned=$want actual=$got"
          [ "$want" = "$got" ] || { echo "::error::工具链漂移, L1 声学确定性要求锁定工具链"; exit 1; }

      - name: 格式检查
        run: cargo fmt --all --check

      - name: 机械红线守卫
        run: python3 scripts/guards/policy_check.py

      # R546: 守卫**自己**也要能被自检 —— 本仓 14 条守卫此前**没有任何自检**，
      # 而那意味着"某条守卫被静默删掉／写坏"时 CI 仍绿。本步断言注册表齐备、
      # 逐条可调用且返回列表（⚠ 它不构造变异输入，故不证明"每条都能报红"）。
      - name: 红线守卫自检 (R546)
        run: python3 scripts/guards/policy_check.py --self-test

      # R540: 九条红线里八条有机器守卫，**只剩红线 1（法务文件禁改）没有**。
      # 它是流程规矩（不是代码属性），故用**内容基线**做机械守卫：六个法务文件
      # 的 SHA-256 与基线一致才算过；⚠ 文件缺失或基线缺失**同样报红**（防空转）。
      - name: 法务文件基线守卫 (红线 1)
        run: python3 scripts/guards/check_legal_files_unchanged.py

      # R65: 工作流的改动永远不被工作流验证 —— 那次只改 `ci.yml` + 文档的推送
      # 让 `plan` 判出空 crate 集合, 于是 `rust` 矩阵腿**整体 skipped**, 新加的腿
      # 在它自己的提交上一次都没跑。因此加一条**不依赖 crate 集合**的结构自检:
      # 只要 `checks` 跑, 它就验证本文件可解析、且关键腿与守卫在位。
      # ⛔ `skipped` 不算绿; 本步骤的证据是它自己的输出行。
      - name: 工作流结构自检 (R65)
        run: python3 scripts/guards/check_workflow_structure.py

      - name: JSON Schema 契约 (schema 自身合法性)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'jsonschema>=4.24'
          python3 scripts/gates/validate_schemas.py

      - name: 采样登记的自洽与**仓库内真实字节**校验
        run: |
          set -euo pipefail
          # 登记式入库（items[].optional=true）下，绝大多数文件**不随仓库分发**；
          # 但仓库内**已有的**字节必须逐项对账 —— 否则「登记」只是清单，不是证据。
          python3 scripts/dev/verify-samples-bytes.py

      - name: 文档契约（链接 / 规范 ID / ID 字典 / 决策清单 / 门禁状态表 / 阶段状态表 / 三方对齐矩阵）
        run: |
          set -euo pipefail
          # 为什么**逐条列出**而不是调用 `run-gates.sh light`: CI 的 checks job 从来只直调脚本
          # （实测 `grep -rn "run-gates" .github/workflows/` = 0 命中）⇒ 新加的守卫**默认不会在 CI 里跑**,
          # 于是"本地绿"与"CI 绿"覆盖的判据不同。这条由 `line/phase-status` 指出, 现在补齐。
          # 七条都必须**逐个退出码检查**（用 `set -e` 直调; 不要指望 shell 函数返回值替你传递失败 ——
          # 本地 `run-gates.sh` 就曾在这一点上把三条守卫的失败屏蔽掉）。
          python3 scripts/gates/check_docs_links.py
          python3 scripts/gates/spec_id_audit.py --check
          python3 scripts/gates/id_dictionary_audit.py
          python3 scripts/gates/check_decisions.py
          python3 scripts/gates/check_gate_status.py
          python3 scripts/gates/check_phase_status.py
          # 三方对齐矩阵: schemas 的每个 yeban_* 工具与 methods.rs 的每条 ui/* 方法都必须被点名;
          # 表里不许出现 crates/ 里 grep 不到的名字; 汇总计数必须与逐行统计相等。
          python3 scripts/gates/check_feature_alignment.py

      - name: 依赖许可清单漂移检查
        run: |
          set -euo pipefail
          # 加依赖/升版本后忘了重新生成清单 -> 变红 (文档不得与真实依赖图脱节)
          python3 scripts/gates/license_inventory.py --check

      - name: 跨语言契约对账 (Rust 样本 ↔ Python jsonschema)
        run: |
          set -euo pipefail
          # 用**非测试**入口导出规范样本: 导出失败就是导出失败, 不会伪装成"测试通过"。
          # 再由 Python 侧的 jsonschema 逐份对账 —— 两个独立实现互相钉住:
          # serde 写的字节必须被 jsonschema 读的契约接受, 契约漂移立刻变红。
          # 每个"有 JSON 契约"的 crate 都要把自己的规范样本导出来, 由 Python 侧对账。
          # 新增一个这样的 crate 就在这里加一行 —— 否则它的契约只是"定义了没人用的类型"。
          cargo run -p yeban-model --locked --example export_schema_samples -- --out target/schema-samples
          cargo run -p yeban-mcp --locked --example export_mcp_samples -- --out target/schema-samples
          # ⚠ 这里**故意没有** `export_ui_samples`(yeban-ui-mcp):
          # 该 crate 经 yeban-ui-test-port 依赖 Slint ⇒ 导出样本会在这个 job 里触发
          # `yeslogic-fontconfig-sys` 的 build script, 而本 job **刻意不装系统库**(它是最轻的一跳)。
          # 实测(ci run 37230347559): 加了那一行 ⇒ checks 红在 fontconfig; 而它在**有**系统库的
          # runner 与本机都能过 —— 也就是说“本地能跑”完全掩盖了这个约束。
          # 且 ui-mcp 的 3 份样本**全是 .meta. 文档样本**(控制面是 JSON-RPC, schemas/ 没有它的 schema),
          # 价值很低; 同一份对账已由 `crates/yeban-ui-mcp/tests/contract.rs` 在 crate 内跑过。
          # ⇒ 不值得为 3 份文档样本把一个 GUI 工具链搬进这个 job。要改就走 workspace 腿。
          python3 scripts/gates/validate_schemas.py --repo-assets --samples-dir target/schema-samples

  # ---------------------------------------------------------------------------
  # 每个受影响 crate 一条矩阵腿: clippy -D warnings + test
  # ---------------------------------------------------------------------------
  rust:
    name: rust (${{ matrix.crate }})
    needs: plan
    # 窄运行 (只碰到少数 crate) 才用矩阵: 快反馈、只装一次该 crate 需要的东西。
    # 宽运行走下面的 rust-workspace 单腿 —— 23 条腿各自装 apt/工具链/解析依赖是纯浪费。
    if: needs.plan.outputs.workspace_wide != 'true' && needs.plan.outputs.crates != '["none"]'
    runs-on: ubuntu-latest
    # ⚠ 2026-10-22（R1034）：**60 → 90**。`#287` 这条腿跑了 22m、`0c27ddbb` 27m，
    #    而 `0c27ddbb` 的**第一次**是 `cancelled` @ 1h5m ⇒ **撞的正是这个 60 分钟**。
    #    `cancelled` ⛔ 不是判决（第 322 条）⇒ 它逼了一次 `gh run rerun`（27m）⇒
    #    净代价一小时。⛔ 这**不是**"慢就没关系"：时长从 22m 涨到 27m 的现象已单独记在
    #    台账 R1034 待查（可疑：`#283`/`#286`/`#287` 新加的测试）；本行只保证
    #    **撞线时给判决而不是给 `cancelled`**。宽运行那条腿本来就是 90（见 rust-workspace）。
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.plan.outputs.crates) }}
    steps:
      - uses: actions/checkout@v4

      # ⭐ 盘回收（2026-10-30，宏轨线实测）。
      #
      # ## 为什么矩阵腿也要这一步
      #
      # 本腿同样要跑 `test (合并特性)` —— 那一步把 ~64 个 `yeban-app` 测试二进制
      # 全部重新链接一遍（每个静态链上整条 Slint / winit 栈）。此前只有
      # `rust (workspace 全量)` 有回收步骤 ⇒ **窄运行时这条最重的腿没有额外空间**。
      #
      # 实测（run `40923947268`，commit `5dd70785`，连跑两次逐字相同）:
      #     `43G target` / `df -h .` = `145G 102G 44G 71%`
      #     → 合并特性腿链接 4 分钟后
      #       `failed to write … test-integration-test-instrument_probe_async:
      #        No space left on device (os error 28)` +
      #       `collect2: fatal error: ld terminated with signal 7 [Bus error]`
      # 对照：同一作业上一次绿（`45752063`）是 `42G target` / `44G 剩`
      # —— 收尾时余量已贴近 0；本次多了一个测试二进制（`ui_macro_panel`，~110 MB）
      # 就越线。⇒ 不是偶发，是**贴边**。
      #
      # 为什么回收而不是 `debug = 0`: 同 `rust (workspace 全量)` 的理由 ——
      # 回收 runner 预装垃圾语义上是惰性的；关 debuginfo 会改变被构建的东西。
      # ⚠ 只删**列名**的目录与 Docker 镜像；**绝不**碰 `/opt/hostedtoolcache`（Rust 工具链就在里面）。
      - name: 回收 runner 预装垃圾（矩阵腿的合并特性 app 腿之前必须留够链接空间）
        run: |
          set -euo pipefail
          echo "== 回收前 =="
          df -h / | tail -1
          for path in \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/share/miniconda \
            /usr/local/.ghcup
          do
            if [ -e "$path" ]; then
              echo "removing $path ($(du -sh "$path" 2>/dev/null | cut -f1 || echo '?'))"
              sudo rm -rf "$path" || true
            fi
          done
          # ⭐ 预装 Docker 镜像（2026-10-30 加）。本仓**任何** job 都不用 docker
          # （实测口径：`grep -rn "docker" .github/ scripts/` 在本次改动前 = 0 命中），
          # 所以删它与删 dotnet / android 同一档：语义惰性。**先打读数再删** ——
          # `docker system df` 的 IMAGE 行给"镜像占了多少字节"，回收前后各打一次，
          # 下一轮就能判"这一刀到底有没有捞到东西"，而不是猜。
          if command -v docker >/dev/null 2>&1; then
            echo "== docker 回收前 =="
            docker system df || true
            docker image rm -f $(docker images -q) >/dev/null 2>&1 || true
            echo "== docker 回收后 =="
            docker system df || true
          fi
          sudo apt-get clean || true
          echo "== 回收后 =="
          df -h / | tail -1
          # ⚠ 盘这一项**必须留读数**：下次若仍红，要能一眼看出是"回收没生效"还是"回收了也不够"

      - name: 安装 Linux 桌面构建依赖 (Slint / winit 需要)
        run: |
          set -euo pipefail
          # yeslogic-fontconfig-sys 的 build script 通过 pkg-config 找 fontconfig;
          # 缺了它会在"编译依赖"阶段就红 (不是我们的代码错, 是 runner 缺系统库)。
          # 一并装上后续真正链接 GUI 二进制时需要的 X11/Wayland/GL 头文件。
          # fonts-noto-cjk: **运行时环境依赖**(不是仓库资产) —— 见 ADR-0001 D24。
          # 没有它, 中文会渲染成豆腐块, 而 Golden 会"稳定地"记录这个错误(比随机失败更危险)。
          sudo apt-get update -qq
          # libasound2-dev 是给 cpal(ALSA) 提前装上的: Phase 2 的音频引擎线一定会需要它,
          # 提前一个提交装好, 免得那条线第一次 CI 又踩同一个坑 (避免"单点阻塞"式的重复踩坑)。
          sudo apt-get install -y -qq --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev \
            libasound2-dev \
            clang libclang-dev \
            fonts-noto-cjk

      - name: 安装钉死工具链
        run: |
          set -euo pipefail
          rustup show
          rustc --version

      - name: clippy (-D warnings)
        run: |
          set -euo pipefail
          set -o pipefail
          cargo clippy -p "${{ matrix.crate }}" --all-targets --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/gate.log"

      - name: test
        run: |
          set -euo pipefail
          set -o pipefail
          cargo test -p "${{ matrix.crate }}" --all-targets --locked 2>&1 | tee -a "$RUNNER_TEMP/gate.log"

      # `--all-targets` **不包含 doctest**（Cargo 的既定行为）。本仓把大量语义写在
      # 文档示例里（`yeban-sfz` 的 SFZ 语义、`yeban-mcp` 的工具面、`yeban-render`
      # 的容器 API）。矩阵腿是大多数 PR 唯一会跑的腿 ⇒ 缺了这一步，"改了文档示例"
      # 在 PR 里**没有任何信号**（本地 `run-gates.sh crate` 的 `cargo test` 不带
      # `--all-targets`，会跑 doctest；CI 只直调 cargo，所以 CI 此前是盲的）。
      - name: test (doctests)
        run: |
          set -euo pipefail
          set -o pipefail
          cargo test -p "${{ matrix.crate }}" --doc --locked 2>&1 | tee -a "$RUNNER_TEMP/gate.log"

      # ⭐ #172: 把 app 的三条 feature test 腿**合并成一条**（clippy 也从两条合并成一条）。
      #
      # 为什么合并（#167 的 `CARGO_INCREMENTAL=0` + 清 incremental **不够**）:
      #   每条 test 腿都是 `--all-targets` ⇒ **63 个集成测试二进制**
      #   （`crates/yeban-app/tests/` 现有 63 个文件，单个 105–112 MB），
      #   而且**每个 feature 组合都要重新链接一遍**。实测（run 39070081067，
      #   commit b39b02c）: 前三条 test 腿跑完后 `du -sh target` = **68G**、
      #   `df` 只剩 **17G**，第四条（in-process-mcp）70 秒内把盘写满，逐字
      #   `error: couldn't create a temp dir: No space left on device (os error 28)`
      #   / `ld terminated with signal 7 [Bus error]`，该步 **0 条 `test result:`**
      #   ⇒ 不是测试红，是编译期爆盘。
      # ⇒ 合并后**一个 feature 组合只链接一次**（默认档一条 + 合并档一条），
      #   而**每个 feature 仍然真的被编进来、真的被测**（这是合并的硬条件）。
      #
      # 机制（⛔ 不是 blanket flag，`--features` 仍按 Cargo.toml 的实际声明过滤）:
      #   ① 特性清单的**单一事实源**是 workflow 级 `APP_FEATURES`（见文件顶部 env）;
      #   ② `scripts/dev/app-features.sh <crate>` 逐条对照 `crates/<crate>/Cargo.toml`
      #      的 `[features]`，只输出该 crate **真的声明了**的那些 —— 对未声明的 crate
      #      传 `--features` 会直接报错（R64/R335 的原话），所以必须过滤;
      #   ③ 因此 yeban-midi-io / yeban-mcp 仍只拿到 `midi-input`、yeban-render 仍只拿到
      #      导出族 —— 与合并前逐腿的开关**逐字相同**，⛔ 不是"给所有 crate 开所有特性"。
      #
      # 判据口径（`scripts/guards/check_workflow_structure.py` 机械比对）:
      #   "合并"最容易出的事故是**某个 feature 被从清单里删掉、于是它的判据一条都不跑**。
      #   该守卫把 `APP_FEATURES` 与 `crates/yeban-app/Cargo.toml` 声明的清单机械比对:
      #   声明了但没进清单（且不在 `AUTO_CI_EXCLUDED` 的书面豁免里）⇒ **红**。
      #
      # 失败可定位（合并后"这是哪条腿"的答案）:
      #   每个测试二进制仍各自打一行 `test result:`，失败行自带二进制名与模块路径;
      #   编译失败自带 `error: could not compile yeban-app (test "…")`;
      #   `--no-fail-fast` 让**一个二进制红了不掩盖其余**; 且本腿开头打印
      #   `== 本腿特性 (<crate>): <实际清单>`，失败摘要里也贴它。
      - name: clippy (合并特性, -D warnings)
        run: |
          set -euo pipefail
          set -o pipefail
          : "${APP_FEATURES:?workflow env APP_FEATURES 未设置（合并特性腿的单一事实源）}"
          features="$(bash scripts/dev/app-features.sh "${{ matrix.crate }}")"
          if [ -z "$features" ]; then
            echo "::notice::${{ matrix.crate }} 未声明 APP_FEATURES 里的任何特性, 本腿跳过"
            exit 0
          fi
          echo "== 本腿特性 (${{ matrix.crate }}): $features"
          cargo clippy -p "${{ matrix.crate }}" --all-targets --locked \
            --features "$features" \
            -- -D warnings 2>&1 | tee -a "$RUNNER_TEMP/gate.log"

      # ⭐ 保留本条（#167 加的）: 它 1 秒内清掉前面两条腿的 incremental 并打印
      # `du -sh target` / `df -h .` —— 在 hosted runner 上**这是唯一能读到的盘读数**，
      # 也是下一轮判"够不够"的依据。合并后它挪到合并档 test 腿**之前**（最重的一次链接）。
      - name: 释放增量目录 (合并档 test 腿之前; 前两条腿的 incremental 会叠加)
        run: |
          set -euo pipefail
          du -sh target 2>/dev/null || true
          rm -rf target/debug/incremental || true
          df -h . || true

      - name: test (合并特性)
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          set -o pipefail
          : "${APP_FEATURES:?workflow env APP_FEATURES 未设置（合并特性腿的单一事实源）}"
          features="$(bash scripts/dev/app-features.sh "${{ matrix.crate }}")"
          if [ -z "$features" ]; then
            echo "::notice::${{ matrix.crate }} 未声明 APP_FEATURES 里的任何特性, 本腿跳过"
            exit 0
          fi
          echo "== 本腿特性 (${{ matrix.crate }}): $features"
          cargo test -p "${{ matrix.crate }}" --all-targets --locked --no-fail-fast \
            --features "$features" \
            2>&1 | tee -a "$RUNNER_TEMP/gate.log"
      - name: 上传无头 UI 截图 (若该 crate 产出了)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ matrix.crate }}
          path: target/ui-test-port
          if-no-files-found: ignore
          retention-days: 30

      - name: 失败摘要 (把错误贴进 job summary)
        if: failure()
        run: |
          {
            echo "### 门禁未通过 — ${{ matrix.crate }}"
            echo '```text'
            tail -80 "$RUNNER_TEMP/gate.log" 2>/dev/null || echo "(没有捕获到日志)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 宽运行: 一次把整个工作区跑完 (等价于 23 条矩阵腿, 但只装一次环境)
  # ---------------------------------------------------------------------------
  rust-workspace:
    name: rust (workspace 全量)
    needs: plan
    if: needs.plan.outputs.workspace_wide == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # ⭐ 盘回收（2026-10-25，R1132 实测教训）。
      #
      # ## 为什么这里需要它
      #
      # 本 job 会跑"合并特性 app 腿"（`test (合并特性, yeban-app)`）——
      # ⚠ 它**不是**唯一一处：矩阵腿（窄运行）也跑同一条腿，并在 2026-10-30 因缺这步
      # 而爆盘（那里已补上同样的回收步骤）。
      # 那一跳要编 ~40 个 `yeban-app` 测试二进制，每个都静态链上整条 Slint / winit /
      # wgpu-free 软件光栅栈 ⇒ **链接体积是本仓最大的一处**。
      #
      # `#327`（f744cc01）/ `#328`（21cb45d2）/ `#329`（f0616d17）三连红，日志逐字:
      #     collect2: fatal error: ld terminated with signal 7 [Bus error], core dumped
      #     ##[warning]You are running out of disk space. … Free space left: 42 MB
      # 而同 job 的 `clippy --workspace` / `test --workspace` / doctests **三步全 success**
      # ⇒ 不是代码、不是链接参数，是**盘被前几步吃掉**。
      #
      # ## 为什么它偏偏在"加一个 Op"时复燃
      #
      # 这三单都碰了 `schemas/**` ⇒ `plan` 判 `workspace_wide` ⇒ **矩阵腿被整体剪掉**，
      # 只剩本 job ⇒ 于是"唯一那条最重的腿"也是"唯一在跑的那条腿"。**每次加 `Op` 都会
      # 再走一遍这条路**，所以这不是偶发。
      #
      # ## 为什么回收而不是 `debug = 0`
      #
      # 关 debuginfo 也能把链接体积压下来，但它**改变了被构建的东西**（panic 回溯失去行号）。
      # 回收 runner 预装垃圾**语义上是惰性的**：删的都是本仓永远不用的 SDK。
      # ⚠ 只删**列名**的目录与 Docker 镜像；**绝不**碰 `/opt/hostedtoolcache`（Rust 工具链就在里面）。
      - name: 回收 runner 预装垃圾（合并特性 app 腿之前必须留够链接空间）
        run: |
          set -euo pipefail
          echo "== 回收前 =="
          df -h / | tail -1
          for path in \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/share/miniconda \
            /usr/local/.ghcup
          do
            if [ -e "$path" ]; then
              echo "removing $path ($(du -sh "$path" 2>/dev/null | cut -f1 || echo '?'))"
              sudo rm -rf "$path" || true
            fi
          done
          # ⭐ 预装 Docker 镜像（2026-10-30 加）。本仓**任何** job 都不用 docker
          # （实测口径：`grep -rn "docker" .github/ scripts/` 在本次改动前 = 0 命中），
          # 所以删它与删 dotnet / android 同一档：语义惰性。**先打读数再删** ——
          # `docker system df` 的 IMAGE 行给"镜像占了多少字节"，回收前后各打一次，
          # 下一轮就能判"这一刀到底有没有捞到东西"，而不是猜。
          if command -v docker >/dev/null 2>&1; then
            echo "== docker 回收前 =="
            docker system df || true
            docker image rm -f $(docker images -q) >/dev/null 2>&1 || true
            echo "== docker 回收后 =="
            docker system df || true
          fi
          sudo apt-get clean || true
          echo "== 回收后 =="
          df -h / | tail -1
          # ⚠ 盘这一项**必须留读数**：下次若仍红，要能一眼看出是"回收没生效"还是"回收了也不够"
          #（后者才需要动链接体积，例如给测试 profile 关 debuginfo）。

      - name: 安装 Linux 桌面构建依赖 (Slint / winit / cpal 需要)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev \
            libasound2-dev \
            clang libclang-dev \
            fonts-noto-cjk

      - name: 安装钉死工具链
        run: |
          set -euo pipefail
          rustup show
          rustc --version

      - name: clippy --workspace (-D warnings)
        run: |
          set -euo pipefail
          set -o pipefail
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/gate.log"

      - name: test --workspace
        run: |
          set -euo pipefail
          set -o pipefail
          cargo test --workspace --all-targets --locked 2>&1 | tee -a "$RUNNER_TEMP/gate.log"

      # 同矩阵腿：`--all-targets` 不含 doctest。宽运行这一跳覆盖全部成员，
      # 因此它也是"一次把整个工作区文档示例编译一遍"的唯一位置。
      - name: test --workspace (doctests)
        run: |
          set -euo pipefail
          set -o pipefail
          cargo test --workspace --doc --locked 2>&1 | tee -a "$RUNNER_TEMP/gate.log"

      # 宽运行这一跳的 `test --workspace` 会留下 incremental; 下面这条 app 合并特性腿
      # 是本 job 最重的一次链接, 先清掉并打印盘读数（与矩阵腿同一条纪律）。
      - name: 释放增量目录 (宽运行的 app 合并特性腿之前)
        run: |
          set -euo pipefail
          du -sh target 2>/dev/null || true
          rm -rf target/debug/incremental || true
          df -h . || true

      # ⭐ #172: 宽运行这一侧也用**同一份** `APP_FEATURES`（⛔ 不再手写一份只有
      # `in-process-mcp` 的清单）。两个理由:
      #   ① 单一事实源: 矩阵腿与全量腿用同一份清单, 增删 feature 只改一处;
      #   ② ⚠ `plan` 判定根级文件（含 `.github/**` / `Cargo.toml` / `scripts/**` /
      #      `schemas/**`）被改动时, **矩阵腿整体被剪掉**（`rust.if: ...`）, 只剩本 job
      #      ⇒ 若本 job 不带这些开关, 那么"任何根级改动"的提交（包括改门禁本身这一次）
      #      一次都不会执行导出族 / midi-input / in-process-mcp 的判据。
      - name: test (合并特性, yeban-app)
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          set -o pipefail
          : "${APP_FEATURES:?workflow env APP_FEATURES 未设置（合并特性腿的单一事实源）}"
          features="$(bash scripts/dev/app-features.sh yeban-app)"
          if [ -z "$features" ]; then
            echo "::notice::yeban-app 未声明 APP_FEATURES 里的任何特性, 本腿跳过"
            exit 0
          fi
          echo "== 本腿特性 (yeban-app): $features"
          cargo test -p yeban-app --all-targets --locked --no-fail-fast \
            --features "$features" \
            2>&1 | tee -a "$RUNNER_TEMP/gate.log"

      # ⚠ 这里**故意暂时没有**"真实界面的内省判据"这一步。
      # 它的首次执行(commit 66b002c, run 37223586792)证明: `crates/yeban-app/src/test_port_adapter.rs`
      # **根本无法编译** —— 它引用了 `report_evidence` / `report_capability`(实际是
      # `yeban_ui_test_port::render` 的公开项, 缺 `use`)与一个未绑定的 `image`。
      # 也就是说: 那条"UI 变更必须双重验证"的判据从未真正执行过, 而且**编译不过**。
      #
      # 已解决(2026-10-05, line/app-introspect, run 37224871698 绿): 适配器的编译错误已修, 而且
      # 判据的接线方式被改得更好 —— 该线用 `[dev-dependencies] yeban-ui-test-port` + 一个**自动发现**的
      # 测试目标 `crates/yeban-app/tests/real_ui_tier1.rs` 让判据进入**默认门禁**
      # (`cargo test --all-targets` 就会跑到), 不再依赖"有人记得加一步 CI"。
      # ⇒ **本步不需要再加回**: 专用步骤会把同一件事做两遍, 而且给出"只有这一步才算验证"的错觉。
      # 证据: `cargo tree -p yeban-app -e normal` 不含 yeban-ui-test-port(release 图未变, 红线 6 未削弱)。

      - name: 上传无头 UI 截图 (Tier-1 光栅化产物, 供人眼复核)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # 为什么必须上传: 无头截图默认落在 runner 的 target/ui-test-port/ 里随容器销毁,
          # 于是"界面被渲染器看过"只能停在"断言通过"这一层 —— 没有人能真的看一眼那张图。
          # 有了 artifact, 任何人事后都能下载核对版面/字体/配色, 而不是只能相信断言。
          name: ui-screenshots-workspace
          path: target/ui-test-port
          if-no-files-found: ignore
          retention-days: 30

      - name: 失败摘要
        if: failure()
        run: |
          {
            echo "### 工作区全量门禁未通过"
            echo '```text'
            tail -120 "$RUNNER_TEMP/gate.log" 2>/dev/null || echo "(没有捕获到日志)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 锁文件与工作区元数据一致性 (MUST-GATE-005 的前半: 确定性 Cargo.lock)
  # ---------------------------------------------------------------------------
  lockfile:
    name: lockfile (确定性 Cargo.lock)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Cargo.lock 必须已提交且与全部清单一致
        run: |
          set -euo pipefail
          test -f Cargo.lock || { echo "::error::Cargo.lock 未提交 (GPLv3 源码可追溯性要求)"; exit 1; }
          cargo metadata --locked --format-version 1 > /dev/null
          echo "Cargo.lock 与全部清单一致, --locked 解析通过"

  # ---------------------------------------------------------------------------
  # 开源合规: cargo-deny (MUST-GATE-004)
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Windows: 只验证**有平台分支**的那两个轻依赖 crate（`yeban-mcp` 的 `.yeban.lock` 走 LockFileEx）。
  #
  # 为什么放进自动档（它原本只是手动档 `windows`）: 实测三次红各抓到一类真问题
  # （强制锁语义 / 判据对 jsonschema 的环境假设 / 平台相关的未使用 import），
  # 而那三条**都只有真在 Windows 上编译才会暴露**。只在手动档跑 = 不防回归。
  #
  # 成本控制: 只在 `plan` 判定 `yeban-mcp` 或 `yeban-model` 受影响时运行；
  # 只跑这两个 crate（零系统库依赖，不需要 Slint/cpal/ALSA），因此不会把 Windows runner 拖满。
  # ---------------------------------------------------------------------------
  windows:
    name: windows (yeban-mcp / yeban-model / yeban-dsp / yeban-render / yeban-decode / yeban-app / yeban-sfz / yeban-engine 的平台分支)
    needs: plan
    if: |
      contains(needs.plan.outputs.crates, 'yeban-mcp') ||
      contains(needs.plan.outputs.crates, 'yeban-model') ||
      contains(needs.plan.outputs.crates, 'yeban-dsp') ||
      contains(needs.plan.outputs.crates, 'yeban-render') ||
      contains(needs.plan.outputs.crates, 'yeban-decode') ||
      contains(needs.plan.outputs.crates, 'yeban-app') ||
      contains(needs.plan.outputs.crates, 'yeban-sfz') ||
      contains(needs.plan.outputs.crates, 'yeban-engine')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: libclang (bindgen 前置；signalsmith-stretch 的 C++ 绑定需要)
        shell: pwsh
        run: |
          # [ARCH-DSP-004 / HD-44=A] 实测: 该依赖用 cc 编 C++ + bindgen 生成绑定 ⇒ 需要 libclang。
          # 镜像若已带 LLVM 就复用, 否则用 choco 安装; 无论哪条路都把 LIBCLANG_PATH 导给后续步骤。
          $candidates = @('C:\Program Files\LLVM\bin', 'C:\Program Files (x86)\LLVM\bin')
          $found = $candidates | Where-Object { Test-Path (Join-Path $_ 'libclang.dll') } | Select-Object -First 1
          if (-not $found) {
            choco install llvm -y --no-progress
            $found = $candidates | Where-Object { Test-Path (Join-Path $_ 'libclang.dll') } | Select-Object -First 1
          }
          if (-not $found) { Write-Error 'libclang.dll 未找到 ⇒ bindgen 会失败'; exit 1 }
          "LIBCLANG_PATH=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "LIBCLANG_PATH=$found"

      - name: 工具链漂移断言 (与 Linux 腿同一个钉死版本)
        shell: bash
        run: |
          set -euo pipefail
          want="$(grep -oE 'channel = "[^"]+"' rust-toolchain.toml | head -1 | cut -d'"' -f2)"
          got="$(rustc --version | awk '{print $2}')"
          [ "$want" = "$got" ] || { echo "::error::工具链漂移, L1 声学确定性要求锁定工具链"; exit 1; }

      - name: clippy (-D warnings)
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          cargo clippy -p yeban-model -p yeban-mcp -p yeban-dsp -p yeban-render -p yeban-decode -p yeban-app -p yeban-sfz -p yeban-engine --all-targets --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/gate.log"

      # 为什么把三个 crate 拆成三步（实测代价换来）:
      # 原先是一条 `cargo test -p yeban-model -p yeban-mcp -p yeban-dsp --all-targets --locked`。
      # 实测一次 `windows` 红: 红的是 `yeban-dsp` 的判据, 而**同一条命令**在第一步失败后就停了,
      # 于是 `yeban-mcp` / `yeban-model` 的读数**根本没产生** —— 失败归属因此**不可读**
      # (日志只覆盖 1/N, 且无法从日志区分"这个 crate 过了"与"这个 crate 没跑")。
      # 拆成三步 + `--no-fail-fast` 之后: 每个 crate 各自出结论, 一个红不再截断另两个的读数。
      # 注意 `--no-fail-fast` 只跨**判据**生效; 同一个判据**内部**的臂首败仍即停
      # (因此判据内的臂必须各自独立, 或由 crate 内的臂计数器报告 N 与跑到第几条)。
      - name: test (yeban-model 的平台分支)
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          cargo test -p yeban-model --all-targets --locked --no-fail-fast 2>&1 | tee -a "$RUNNER_TEMP/gate.log"

      - name: test (yeban-mcp 的 .yeban.lock Windows 分支)
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          cargo test -p yeban-mcp --all-targets --locked --no-fail-fast 2>&1 | tee -a "$RUNNER_TEMP/gate.log"

      - name: test (yeban-dsp 的扫描器)
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          cargo test -p yeban-dsp --all-targets --locked --no-fail-fast 2>&1 | tee -a "$RUNNER_TEMP/gate.log"

