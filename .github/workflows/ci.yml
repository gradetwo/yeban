      # 于是 `yeban-mcp` / `yeban-model` 的读数**根本没产生** —— 失败归属因此**不可读**
      # (日志只覆盖 1/N, 且无法从日志区分"这个 crate 过了"与"这个 crate 没跑")。
      # 拆成三步 + `--no-fail-fast` 之后: 每个 crate 各自出结论, 一个红不再截断另两个的读数。
