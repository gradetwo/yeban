    needs: plan
    if: |
      contains(needs.plan.outputs.crates, 'yeban-mcp') ||
      contains(needs.plan.outputs.crates, 'yeban-model') ||
      contains(needs.plan.outputs.crates, 'yeban-dsp') ||
      contains(needs.plan.outputs.crates, 'yeban-render') ||
      contains(needs.plan.outputs.crates, 'yeban-decode') ||
      contains(needs.plan.outputs.crates, 'yeban-app') ||
      contains(needs.plan.outputs.crates, 'yeban-sfz') ||
      contains(needs.plan.outputs.crates, 'yeban-engine')
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: libclang (bindgen 前置；macOS 由 Xcode CLT 提供，导出 LIBCLANG_PATH)
        shell: bash
        run: |
          set -euo pipefail
          # macOS 上 libclang 不在 SDK 里，逐个候选并**验证**它真含 libclang.dylib，
          # 否则 bindgen 会在编译 signalsmith-stretch 时失败（曾因此让本腿红一次）。
          cands=()
          if command -v brew >/dev/null 2>&1; then
            p="$(brew --prefix llvm 2>/dev/null || true)"; [ -n "$p" ] && cands+=("$p/lib")
            p="$(brew --prefix llvm@18 2>/dev/null || true)"; [ -n "$p" ] && cands+=("$p/lib")
          fi
          cands+=("$(xcode-select -p)/usr/lib")
          cands+=("$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib")
          cands+=("/opt/homebrew/opt/llvm/lib" "/usr/local/opt/llvm/lib")
          found=""
          for c in "${cands[@]}"; do
            if [ -e "$c/libclang.dylib" ] || [ -e "$c/libclang.1.dylib" ]; then found="$c"; break; fi
          done
          if [ -z "$found" ]; then
            echo "::error::找不到 libclang.dylib；已试: ${cands[*]}"
            exit 1
          fi
          echo "LIBCLANG_PATH=$found" >> "$GITHUB_ENV"
          echo "libclang: $found"

      - name: 工具链漂移断言 (与 Linux 腿同一个钉死版本)
        shell: bash
        run: |
          set -euo pipefail
          want="$(grep -oE 'channel = "[^"]+"' rust-toolchain.toml | head -1 | cut -d'"' -f2)"
          got="$(rustc --version | awk '{print $2}')"
          [ "$want" = "$got" ] || { echo "::error::工具链漂移, L1 声学确定性要求锁定工具链"; exit 1; }

      - name: clippy (-D warnings)
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          cargo clippy -p yeban-model -p yeban-mcp -p yeban-dsp -p yeban-render -p yeban-decode -p yeban-app -p yeban-sfz -p yeban-engine --all-targets --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/gate.log"

