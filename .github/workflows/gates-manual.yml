# 夜半 (Yeban) 手动触发门禁 —— 重活与专项验证
#
# 为什么需要手动档 (用户要求: 自动触发 + 手动触发双模式):
#   - 自动档 (ci.yml) 只跑「每次都该跑且够快」的门禁, 保证多线并行不被拖慢;
#   - 手动档跑**昂贵/专项**的门禁: 全 feature 组合编译、基准、模糊测试、
#     确定性对账。它们要么耗时长, 要么需要特定硬件, 不适合每次推送都跑。
#
# 诚实纪律 (SKILL「Honesty rules」): 尚未具备运行条件的门禁**明确列为 PENDING**,
#   而不是用一个永远绿的假 job 冒充通过。PENDING 的清单同时登记在
#   docs/DEVELOPMENT_LEDGER.md, 由人来决定何时补上基础设施。

name: Gates (手动)

on:
  workflow_dispatch:
    inputs:
      gate:
        description: "要跑的手动门禁"
        type: choice
        default: inventory
        options:
          - inventory
          - all-features
          - bench
          - fuzz
          - arm
          - windows
          - determinism
          - pending
      crate:
        description: "all-features 档位下的单个 crate (留空 = 整个工作区)"
        type: string
        default: ""
      fuzz_runs:
        description: 'fuzz 档位的执行次数上限 (MUST-GATE-011 的"千万次"数的是**执行次数**, 不是秒数)'
        required: false
        type: string
        default: "10000000"
      fuzz_seconds:
        description: 'fuzz 档位的单目标最长运行秒数 (作为 fuzz_runs 的**安全上限**; 60s 只是冒烟)'
        type: number
        default: 7200

concurrency:
  # 分组键里带上**档位**: 不同的手动门禁彼此**互不阻塞**(fuzz 跑 85 分钟时 arm 仍能立刻开跑),
  # 而**同一个档位**的重复触发仍然串行(cancel-in-progress: false), 避免两条同档互相踩。
  #
  # 为什么改: 实测一次 —— `arm` 档派发后长时间停在 `pending`, 原因不是 ARM runner 排队,
  # 而是旧的 group 只按 ref 分组, 于是它**等在那条 85 分钟的 fuzz 后面**。
  # 人类负责人的要求是"并发、自动触发及手工触发用好" ⇒ 手动门禁之间不该互相堵。
  group: gates-manual-${{ github.ref }}-${{ inputs.gate }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # 证据审计要读本仓库的 workflow runs（少了它会 403 ⇒ 整步红）

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 门禁清单: 把「哪些门禁已接线、哪些还缺基础设施」写进 job summary
  # ---------------------------------------------------------------------------
  inventory:
    name: inventory (门禁清单)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: 渲染门禁清单（自动取自唯一事实源）
        run: |
          set -euo pipefail
          {
            echo "### 手动档门禁"
            echo
            echo "| 档位 | 用途 |"
            echo "| :--- | :--- |"
            echo "| \`inventory\` | 这份清单 + 门禁状态表自检 |"
            echo "| \`all-features\` | 单 crate 的全 feature 组合编译与 clippy |"
            echo "| \`bench\` | BASELINE-001 渲染吞吐 + BASELINE-004 单步撤销 p99 |"
            echo "| \`fuzz\` | MUST-GATE-011：按**执行次数**（默认一千万次）跑 cargo-fuzz |"
            echo "| \`windows\` | 平台分支真编译真跑（LockFileEx 等） |"
            echo "| \`arm\` | MUST-GATE-003：x86_64 ↔ aarch64 的 L1 收据对账 |"
            echo "| \`determinism\` | 跨次运行的确定性复跑 |"
            echo "| \`pending\` | 剩余 PENDING 门禁的现状快照 |"
            echo
            # 状态表是唯一事实源: 直接生成, 不再手抄（手抄那份曾与它分叉好几轮）。
            python3 scripts/gates/check_gate_status.py --summary
            echo
            echo "**本机不跑重活**: 开发机是 Apple M2，全量构建/基准/模糊测试一律在 CI 上执行"
            echo "（\`docs/DEV_WORKFLOW.md\`）。BASELINE 系列需要固定频率的参考硬件，"
            echo "GitHub 托管 runner 频率不固定，因此那几条必须等参考机就位后再谈达标。"
          } >> "$GITHUB_STEP_SUMMARY"
          # 同时自检: 状态表腐烂就红。
          python3 scripts/gates/check_gate_status.py
      - name: MUST-GATE-009 发行物层面的"危险能力默认关"断言
        run: |
          set -euo pipefail
          # 进程内已有 112 条判据（默认关/只绑环回/0600/ui:inject 硬禁）；缺的是**产物级**：
          # 默认构建出来的那个二进制，到底有没有把网络监听代码链进去？⇒ 不问源码，**问产物**。
          cargo build -p yeban-mcp --locked
          bash scripts/gates/check_release_defaults.sh

      - name: MUST-GATE-005 源码分发包完备性（含真跑 cargo vendor --locked，联网）
        run: |
          set -euo pipefail
          # 规范: 发布源码包必须完整包含所有 `.slint` + 确定性 `Cargo.lock` + `cargo vendor` 离线依赖。
          # 本步骤在**联网**的手动档里跑 `--full`（真下载 vendor，体积大）⇒ 这正是"重活放 CI"的用法。
          bash scripts/gates/check_vendor.sh --full

      - name: 打印 L1 摘要记录（供采集"同平台参考摘要"；MUST-GATE-002 闭环用）
        run: |
          set -euo pipefail
          # 规范要的是"**同平台的两台机器**"：本机参考摘要是 macOS，而 CI 是 Linux ⇒ 判据 ① 只能如实 SKIP。
          # 这一步在 Linux 上产出一份摘要记录并打印；采集后提交为第二份参考，同一判据即变"同平台 PASS"。
          # ⚠ 只打印, 不自动写仓库 —— 参考摘要必须人看过来源与工具链之后再提交。
          SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH:-1759638400} \
            cargo run --release --locked -p yeban-render --example export_l1_digest -- --out /tmp/l1-digest-linux.json --pretty
          echo '--- 供采集的单行记录（复制下面这一行） ---'
          python3 -c "import json,pathlib;print(json.dumps(json.loads(pathlib.Path('/tmp/l1-digest-linux.json').read_text()),ensure_ascii=False,separators=(',',':')))"

      - name: 采样按 pin 取回并逐字节校验（联网, 有界；证明登记可复核）
        run: |
          set -euo pipefail
          # "一个无法取回、无法校验的登记, 不是证据, 只是清单。" ⇒ 真按 repo+pin 取回并比对 sha256。
          # 有界（默认 200 个最小文件）以免拖垮环境；全量 9.4 GiB 用 --all（参考机）。
          # --tolerate-404 是临时的：清单还没登记每个文件的上游路径（上游路径靠推导，
          # 实测有 1 条推不出来）⇒ 让「其余 199 条已通过」不被那 1 条判死，但打 warning 并点名。
          # 真正的红线是「推导不出路径的条目数 == 0」；清单补上上游路径后应去掉这个开关。
          python3 scripts/dev/fetch-samples.py --limit 200 --tolerate-404

      - name: 采样登记与字节自洽（登记式入库的当前形态：只证明清单自洽）
        run: |
          set -euo pipefail
          # 8.9 MB 的 assets/samples/manifest.json 是**生成物**，此前生成器/校验器只以附录形式
          # 嵌在一条线的台账里（needs N3）⇒ **生成物没有生成器、登记没有校验器**。
          # 本步骤把"哪些 optional 未分发 / 哪些应分发却缺 / 哪些字节不符"分门别类讲清楚。
          # ⚠ 它**不**联网下载素材：真字节全量校验需要一个**联网**的手动档 job（仍记 needs）。
          python3 scripts/dev/verify-samples-bytes.py

      - name: 证据审计（被引用的 CI run id 是否真的存在）
        env:
          # ⚠ 没有 token 时 `gh api` 一律失败 ⇒ 脚本会把"读不到"当"不存在"（首次派发手动档时就是这样：
          # 75 个 run id 全报不可读、整步红、**连带后面的检查全都没跑到**）。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 本仓库的口径是"每个结论都要有可复跑的判决"。但**引用一个 run id 不等于**那个判决支持你说的话 ⇒
          # 机械核对①它是否存在 ②它的结论是什么; 非 success 的逐条列出供人工核对**措辞是否诚实**（L23/L26）。
          python3 scripts/dev/evidence-audit.py

      - name: 远程分支卫生（已合并的工作线分支不应留在 origin）
        run: |
          set -euo pipefail
          # 实测漂移: 第 12 轮发现 origin 上积了 12 条**已合并**的 line/* 分支,
          # 而账本当时写着"远程只剩 main 与 website"。人写的口径会漂移, 机器写的不会。
          bash scripts/dev/branch-hygiene.sh

  # ---------------------------------------------------------------------------
  # 全 feature 组合编译: 只有手动档才跑 (很慢), 但能拦住 feature 门后的编译错误
  # ---------------------------------------------------------------------------
  all-features:
    name: all-features (${{ inputs.crate || 'workspace' }})
    if: inputs.gate == 'all-features'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Linux 桌面构建依赖 (Slint / winit 需要)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # libasound2-dev 是给 cpal(ALSA) 提前装上的: Phase 2 的音频引擎线一定会需要它,
          # 提前一个提交装好, 免得那条线第一次 CI 又踩同一个坑 (避免"单点阻塞"式的重复踩坑)。
          sudo apt-get install -y -qq --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev \
            libasound2-dev \
            fonts-noto-cjk
      - name: 安装钉死工具链
        run: |
          set -euo pipefail
          rustup show
          rustc --version
      - name: clippy --all-features
        run: |
          set -euo pipefail
          set -o pipefail
          if [ -n "${{ inputs.crate }}" ]; then
            cargo clippy -p "${{ inputs.crate }}" --all-features --all-targets --locked -- -D warnings 2>&1 | tee /tmp/gate.log
          else
            cargo clippy --workspace --all-features --all-targets --locked -- -D warnings 2>&1 | tee /tmp/gate.log
          fi
      - name: 失败摘要
        if: failure()
        run: |
          {
            echo "### all-features 门禁未通过"
            echo '```text'
            tail -80 /tmp/gate.log 2>/dev/null || true
            echo '```'
          } | tee /tmp/cmp-summary.md >> "$GITHUB_STEP_SUMMARY"
          # ⚠ 上面用 `tee`: 判决**必须同时进日志**。
          # 实测教训: 第一版只写 `>> "$GITHUB_STEP_SUMMARY"` ⇒ 判决只出现在 job summary,
          # 而 `gh run view --log` 抓不到它 —— 于是"门禁绿了"这件事可读, 但"它凭什么绿"读不到。

  # ---------------------------------------------------------------------------
  # 基准: 目前没有任何 criterion 基准, 只验证 bench 目标可编译
  # ---------------------------------------------------------------------------
  bench:
    name: bench (数量级测量)
    if: inputs.gate == 'bench'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: 系统库 (GUI/音频链接需要)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config libfontconfig1-dev libfreetype-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libgl1-mesa-dev libasound2-dev fonts-noto-cjk
      - name: 'BASELINE-001 离线渲染吞吐 (参考工程 A)'
        run: |
          set -euo pipefail
          set -o pipefail
          # 为什么用 example 而不是 criterion: 见 crates/yeban-render/examples/bench_render.rs 的文件头
          # (零新增依赖 + 可被门禁直接调用 + 判据跑在 debug 断言与并行测试里, 量不出有意义的数)。
          cargo run --release -p yeban-render --locked --example bench_render -- 32 30 2>&1 | tee /tmp/bench.log
      - name: 'BASELINE-002 峰值常驻内存 (空/演示工程)'
        run: |
          set -euo pipefail
          set -o pipefail
          {
            echo "### BASELINE-002 峰值常驻内存（目标 ≤ 35 MB）"
            echo
            echo '```text'
            # ① 主程序：加载演示工程后的峰值 RSS（托管 runner 上只能给**数量级**）
            python3 scripts/gates/measure_rss.py --label app-headless-demo --timeout 300 -- \
              cargo run --release -p yeban-app --locked -- --headless 2>&1 | tee -a /tmp/bench.log
            # ② 模型层参考点：证明"模型本身的开销"远小于门禁阈值（对照用，不是达标依据）
            python3 scripts/gates/measure_rss.py --label model-export-samples --timeout 300 -- \
              cargo run --release -p yeban-model --locked --example export_schema_samples 2>&1 | tee -a /tmp/bench.log
            echo '```'
            echo
            echo "**诚实边界**：读数取自 \`resource.getrusage(RUSAGE_CHILDREN).ru_maxrss\`（子进程峰值高水位）；"
            echo "托管 runner 的绝对值只能给数量级，**达标判定必须在规范指定的参考机上复跑同一条命令**。"
          } | tee /tmp/rss-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 'BASELINE-004 单步撤销时延 (p99)'
        run: |
          set -euo pipefail
          set -o pipefail
          # 纯计算 + 零重依赖 ⇒ 这条即使在托管 runner 上也有意义(不像渲染吞吐那样必须独占机器);
          # 但**绝对值**仍只作数量级参考, 达标判定要在规范指定的参考机型上复跑。
          cargo run --release -p yeban-model --locked --example bench_undo -- 20000 2>&1 | tee -a /tmp/bench.log
      - name: criterion 目标编译校验 (若存在)
        run: |
          set -euo pipefail
          if compgen -G "crates/*/benches/*.rs" > /dev/null || compgen -G "benches/*.rs" > /dev/null; then
            cargo bench --workspace --locked
          else
            echo "::notice::尚无 criterion 基准用例(benches/*.rs); DoD 4 的 3% 回归阈值见下方口径声明"
          fi
      - name: 测量结果 + 口径声明
        if: always()
        run: |
          {
            echo '### BASELINE 读数 (数量级, 不是达标判定)'
            echo ''
            echo '```text'
            grep -E '^BENCH ' /tmp/bench.log 2>/dev/null || echo '(没有捕获到 BENCH 行)'
            echo '```'
            echo ''
            echo '**运行环境**: GitHub 托管 runner (ubuntu-latest)。CPU 型号共享且频率不固定,'
            echo '因此读数只能给**数量级**, **不能**用来判定 BASELINE-001 的 ">=100x 实时" 是否达标。'
            echo ''
            echo '**DoD 4 的 "衰退不得超过 3%"** 需要**可比的固定硬件**才成立(自托管 runner 或指定参考机)。'
            echo '托管 runner 上不同次运行的 CPU 漂移远超 3%, 该阈值在本 CI 上**不可判定**, 记为 pending;'
            echo '不要把它读成"通过"或"不通过"。'
            echo ''
            echo '**复跑方式**: cargo run --release -p yeban-render --example bench_render -- <轨数> <秒数>'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # MUST-GATE-003: L2 跨架构对账 (x86_64 ↔ aarch64)
  #
  # 为什么现在能做了: 规范要求"跨架构 < 1e-6"，此前缺的**不是硬件** —— GitHub 对公开仓库
  # 提供 ARM runner（`ubuntu-24.04-arm`）。缺的是**可跨机比较的产物**，它由 `line/l1-digest` 交付
  # （`export_l1_receipt` / `compare_l1_receipts`）。
  #
  # 判决完全由比较器的退出码给出: 0 = L1-bit-exact 或 L2-within-budget; 1 = 超预算; 2 = 收据缺失/不可比。
  # 两种口径各跑一次: 纯 IEEE 类（应当**逐位相同**）与带增益的超越函数类（只要求落在预算内）。
  # ---------------------------------------------------------------------------
  arm-receipts:
    name: arm 收据 (${{ matrix.arch }})
    if: inputs.gate == 'arm'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: 工具链漂移断言
        run: |
          set -euo pipefail
          want="$(grep -oE 'channel = "[^"]+"' rust-toolchain.toml | head -1 | cut -d'"' -f2)"
          got="$(rustc --version | awk '{print $2}')"
          [ "$want" = "$got" ] || { echo "::error::工具链漂移"; exit 1; }
          echo "arch=$(uname -m) rustc=$got"

      - name: 导出 L1 收据（IEEE 精确类：期望跨架构逐位相同）
        run: |
          set -euo pipefail
          set -o pipefail
          cargo run --release -p yeban-render --locked --example export_l1_receipt -- \
            --out receipt-${{ matrix.arch }}-exact.txt 2>&1 | tee /tmp/arm.log

      - name: 导出 L1 收据（超越函数类：只要求落在预算内）
        run: |
          set -euo pipefail
          set -o pipefail
          cargo run --release -p yeban-render --locked --example export_l1_receipt -- \
            --gain-db 3 --out receipt-${{ matrix.arch }}-gain3.txt 2>&1 | tee -a /tmp/arm.log

      - name: 上传收据（证据）
        uses: actions/upload-artifact@v4
        with:
          name: l1-receipts-${{ matrix.arch }}
          path: receipt-*.txt
          if-no-files-found: error

  arm-compare:
    name: arm 对账 (MUST-GATE-003)
    needs: arm-receipts
    if: inputs.gate == 'arm'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 取回两份收据
        uses: actions/download-artifact@v4
        with:
          pattern: l1-receipts-*
          merge-multiple: true
          path: receipts

      - name: 对账（退出码即结论）
        run: |
          set -euo pipefail
          {
            echo "### MUST-GATE-003 跨架构对账"
            echo
            echo '```text'
            ls -l receipts
            echo
            echo "--- IEEE 精确类（期望 L1-bit-exact）---"
            # ⚠ 不管道给 head/tail（L6）: 管道的退出码会掩盖判决。
            cargo run --release -p yeban-render --locked --example compare_l1_receipts -- \
              receipts/receipt-x86_64-exact.txt receipts/receipt-aarch64-exact.txt 2>&1 | tee /tmp/cmp-exact.log
            echo
            echo "--- 超越函数类（期望 L2-within-budget）---"
            cargo run --release -p yeban-render --locked --example compare_l1_receipts -- \
              receipts/receipt-x86_64-gain3.txt receipts/receipt-aarch64-gain3.txt 2>&1 | tee /tmp/cmp-gain3.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 失败摘要
        if: failure()
        run: |
          {
            echo "### arm 对账未通过"
            echo '```text'
            tail -60 /tmp/cmp-exact.log /tmp/cmp-gain3.log 2>/dev/null || true
            echo '```'
            echo "退出码 1 = 超出预算（D32: IEEE 精确类零容差 / 超越函数类 1e-6 与 4096 ulp）;"
            echo "退出码 2 = 收据缺失或不可比。"
          } >> "$GITHUB_STEP_SUMMARY"

  # 模糊测试 (MUST-GATE-011): 独立 fuzz workspace, 需要 nightly + cargo-fuzz
  # ---------------------------------------------------------------------------
  fuzz:
    name: fuzz (cargo-fuzz, ${{ inputs.fuzz_runs }} 次执行 / 上限 ${{ inputs.fuzz_seconds }}s)
    if: inputs.gate == 'fuzz'
    runs-on: ubuntu-latest
    # 为什么是 180 而不是 90: 实测稳态速率随语料增长而下降
    # (90s 那轮 10 415 exec/s → 1000s 那轮 3 519 → 3300s 那轮 2 126),
    # 按 ~2 000 exec/s 估, 一千万次约需 85 分钟 —— 90 分钟会**卡在边界上**,
    # 于是"跑没跑完"变成运气。留足余量, 让判决只取决于执行次数。
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: 安装 nightly 与 cargo-fuzz
        run: |
          set -euo pipefail
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: 跑 SFZ 解析器模糊测试 (零崩溃 = 通过)
        working-directory: crates/yeban-sfz
        run: |
          set -euo pipefail
          # cargo-fuzz 是独立 workspace (自带 [workspace]), 因此这里有它自己的 target/。
          # `-runs=N` 才是规范说的"千万次变异"的直接映射: libFuzzer 跑满 N 次执行后停下并打印统计。
          # `-max_total_time` 仍然给, 但只是**安全上限**(卡住/异常慢时不至于占满 runner)。
          cargo +nightly fuzz run sfz_parse -- \
            -runs=${{ inputs.fuzz_runs }} \
            -max_total_time=${{ inputs.fuzz_seconds }} \
            -print_final_stats=1
      - name: 失败时保留语料 (崩溃样本是最有价值的产物)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: crates/yeban-sfz/fuzz/artifacts
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Windows: 验证"从没编译过"的那条分支 (`.yeban.lock` 的 LockFileEx 路径)。
  # 只跑**轻依赖**的 crate(yeban-mcp 只依赖 serde/serde_json/thiserror/yeban-model),
  # 因此不需要 Slint/cpal, 也不会在 Windows runner 上装一堆系统库。
  # 为什么值得: `std::fs::File::try_lock` 在 Unix 走 flock、在 Windows 走 LockFileEx ——
  # 两者的语义差异(共享/独占、同进程多句柄)只有真跑才能发现; 之前它一直标着"从未编译"。
  # ---------------------------------------------------------------------------
  windows:
    name: windows (锁与模型真编译真跑)
    if: inputs.gate == 'windows'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: yeban-model 测试 (纯 Rust, 无平台分支)
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          cargo test -p yeban-model --locked 2>&1 | tee /tmp/model.log
      - name: yeban-mcp 全部目标 (含 .yeban.lock 的 Windows 分支)
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          cargo test -p yeban-mcp --locked --all-targets 2>&1 | tee /tmp/mcp.log
      - name: clippy (-D warnings) on the same crates
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          cargo clippy -p yeban-model -p yeban-mcp --all-targets --locked -- -D warnings 2>&1 | tee /tmp/clippy.log
      - name: 结果摘要
        if: always()
        shell: bash
        run: |
          {
            echo "### Windows 验证 (从没编译过的平台分支)"
            echo ''
            echo '```text'
            grep -E 'test result: ok|test result: FAILED' /tmp/model.log /tmp/mcp.log 2>/dev/null || echo '(没有捕获到测试结果)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 确定性对账 (L1/L2): 目前无渲染器, 明确列为 PENDING
  # ---------------------------------------------------------------------------
  determinism:
    name: determinism (PENDING)
    if: inputs.gate == 'determinism'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 未接线说明
        run: |
          {
            echo "### 未执行: 确定性对账 (MUST-GATE-002 / MUST-GATE-003)"
            echo ""
            echo "阻断项:"
            echo "1. **同一平台**的第二台机器尚未接入 —— `line/gate-cross-machine-digest` 已交付**可对照的 L1 摘要记录**"
            echo "   （`yeban-render` 的 `l1_digest_record` + 比较器 `examples/compare_l1_digests.rs`，退出码 0/1/2），"
            echo "   但『同平台两台机器全同』这条**唯一缺口**需要第二台硬件；跨 ISA 的全同属 MUST-GATE-003（`arm` 档）。"
            echo "   ⚠ 旧版本这里写的是『yeban-render 尚未实现』—— 已过期（它早已实现并有 L1 判据）。"
            echo "2. L1 需要在锁定 ISA/工具链的固定频率机器上产出参考短语 WAV 的 SHA-256;"
            echo "3. L2 需要 x86_64 与 AArch64 两个 runner 同时产出并对账 (< 1e-6)。"
            echo ""
            echo "登记位置: docs/DEVELOPMENT_LEDGER.md 的 pending 清单。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::determinism 门禁尚未接线 (PENDING), 详见 job summary"

  # ---------------------------------------------------------------------------
  # 一次性列出全部 PENDING 门禁, 方便人类决定补哪块基础设施
  # ---------------------------------------------------------------------------
  pending:
    name: pending (待补基础设施清单)
    if: inputs.gate == 'pending'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 校验门禁状态表本身没有腐烂
        run: python3 scripts/gates/check_gate_status.py
      - name: 渲染门禁状态表 (单一事实源) + 列出账本里仍未闭环的 PENDING
        run: |
          set -euo pipefail
          {
            echo "## 门禁状态 (来自 docs/ledger/gate-status.md)"
            echo ""
            cat docs/ledger/gate-status.md
            echo ""
            echo "---"
            echo "## 账本里仍未闭环的 PENDING (原始留痕, 供交叉核对)"
            echo '```text'
            grep -rn "PENDING" docs/DEVELOPMENT_LEDGER.md | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
