# 夜半 (Yeban) 手动触发门禁 —— 重活与专项验证
#
# 为什么需要手动档 (用户要求: 自动触发 + 手动触发双模式):
#   - 自动档 (ci.yml) 只跑「每次都该跑且够快」的门禁, 保证多线并行不被拖慢;
#   - 手动档跑**昂贵/专项**的门禁: 全 feature 组合编译、基准、模糊测试、
#     确定性对账。它们要么耗时长, 要么需要特定硬件, 不适合每次推送都跑。
#
# 诚实纪律 (SKILL「Honesty rules」): 尚未具备运行条件的门禁**明确列为 PENDING**,
#   而不是用一个永远绿的假 job 冒充通过。PENDING 的清单同时登记在
#   docs/DEVELOPMENT_LEDGER.md, 由人来决定何时补上基础设施。

name: Gates (手动)

on:
  workflow_dispatch:
    inputs:
      gate:
        description: "要跑的手动门禁"
        type: choice
        default: inventory
        options:
          - inventory
          - all-features
          - bench
          - fuzz
          - determinism
          - pending
      crate:
        description: "all-features 档位下的单个 crate (留空 = 整个工作区)"
        type: string
        default: ""
      fuzz_seconds:
        description: 'fuzz 档位的单目标最长运行秒数 (MUST-GATE-011 要求"千万次变异", 60s 只是冒烟)'
        type: number
        default: 60

concurrency:
  group: gates-manual-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 门禁清单: 把「哪些门禁已接线、哪些还缺基础设施」写进 job summary
  # ---------------------------------------------------------------------------
  inventory:
    name: inventory (门禁清单)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 渲染门禁清单
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<'TABLE'
          ### 门禁清单 (MUST-GATE 体系)

          | 门禁 | 内容 | 状态 | 运行位置 |
          | :--- | :--- | :--- | :--- |
          | MUST-GATE-004 | `cargo deny check` 开源合规 | 已接线 | ci.yml (每次推送) |
          | MUST-GATE-005 (前半) | 确定性 Cargo.lock + `--locked` 解析 | 已接线 | ci.yml (每次推送) |
          | AGENTS.md DoD 1 | fmt + clippy --all-targets -D warnings | 已接线 | ci.yml (受影响 crate 矩阵) |
          | AGENTS.md DoD 2 | 单元/属性测试 | 已接线 | ci.yml (受影响 crate 矩阵) |
          | 红线守卫 G01–G11 | HashMap/GUI 依赖/0.0.0.0/大文件/ASIO/通配版本 | 已接线 | ci.yml `checks` |
          | Schema 契约 | schemas/*.json 合法性 + 样本对账 | 已接线 | ci.yml `checks` |
          | MUST-GATE-001/012 | 实时回调零分配 (分配 Hook) | PENDING | 需 `yeban-engine` 实现后接线 |
          | MUST-GATE-002 | L1 bit-exact WAV SHA-256 | PENDING | 需 `yeban-render` + 锁定 ISA |
          | MUST-GATE-003 | L2 跨架构 < 1e-6 对账 | PENDING | 需 x86_64 + AArch64 双 runner |
          | MUST-GATE-006/007 | Zip-Slip 与解压炸弹 | PENDING | 需 `.yeban` 容器实现 |
          | MUST-GATE-008 | `.yeban.lock` 并发 `PROJECT_LOCKED` | PENDING | 需锁实现 |
          | MUST-GATE-009 | MCP 默认安全 (绑定/Token/ui:inject) | PENDING | 需 `yeban-mcp` HTTP 形态 |
          | MUST-GATE-010 | proptest 10,000 步撤销守恒 | PENDING | 需 `Op` 全变体实现 |
          | MUST-GATE-011 | cargo-fuzz 千万次变异 | **已接线 (手动档)** | `Gates (手动)` → `gate=fuzz`；目标在 `crates/yeban-sfz/fuzz/`，**尚未真实执行过** |
          | MUST-GATE-013 | 仓库无 ASIO SDK | 已接线 | ci.yml `checks` (守卫 G07) |
          | MUST-GATE-014 | 323 款采样指纹对账 | PENDING | 需资产清单落地 |
          | MUST-GATE-015 | Golden 图来自 Tier-1 软件光栅化 | PENDING | 需 `yeban-ui-test-port` |
          | BASELINE-001..006 | 性能基准线 | PENDING | 需固定频率基准机 (M2 Pro / Ryzen 7840HS) |

          **本机不跑重活**: 开发机是 Apple M2, 全量构建/基准/模糊测试一律在 CI 上执行
          (docs/DEV_WORKFLOW.md)。基准门禁需要固定频率的参考硬件, GitHub 托管 runner
          频率不固定, 因此 BASELINE 系列必须等自托管 runner 就位后再接线。
          TABLE

  # ---------------------------------------------------------------------------
  # 全 feature 组合编译: 只有手动档才跑 (很慢), 但能拦住 feature 门后的编译错误
  # ---------------------------------------------------------------------------
  all-features:
    name: all-features (${{ inputs.crate || 'workspace' }})
    if: inputs.gate == 'all-features'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Linux 桌面构建依赖 (Slint / winit 需要)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # libasound2-dev 是给 cpal(ALSA) 提前装上的: Phase 2 的音频引擎线一定会需要它,
          # 提前一个提交装好, 免得那条线第一次 CI 又踩同一个坑 (避免"单点阻塞"式的重复踩坑)。
          sudo apt-get install -y -qq --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev \
            libasound2-dev \
            fonts-noto-cjk
      - name: 安装钉死工具链
        run: |
          set -euo pipefail
          rustup show
          rustc --version
      - name: clippy --all-features
        run: |
          set -euo pipefail
          set -o pipefail
          if [ -n "${{ inputs.crate }}" ]; then
            cargo clippy -p "${{ inputs.crate }}" --all-features --all-targets --locked -- -D warnings 2>&1 | tee /tmp/gate.log
          else
            cargo clippy --workspace --all-features --all-targets --locked -- -D warnings 2>&1 | tee /tmp/gate.log
          fi
      - name: 失败摘要
        if: failure()
        run: |
          {
            echo "### all-features 门禁未通过"
            echo '```text'
            tail -80 /tmp/gate.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 基准: 目前没有任何 criterion 基准, 只验证 bench 目标可编译
  # ---------------------------------------------------------------------------
  bench:
    name: bench (数量级测量)
    if: inputs.gate == 'bench'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: 系统库 (GUI/音频链接需要)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config libfontconfig1-dev libfreetype-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libgl1-mesa-dev libasound2-dev fonts-noto-cjk
      - name: 'BASELINE-001 离线渲染吞吐 (参考工程 A)'
        run: |
          set -euo pipefail
          set -o pipefail
          # 为什么用 example 而不是 criterion: 见 crates/yeban-render/examples/bench_render.rs 的文件头
          # (零新增依赖 + 可被门禁直接调用 + 判据跑在 debug 断言与并行测试里, 量不出有意义的数)。
          cargo run --release -p yeban-render --locked --example bench_render -- 32 30 2>&1 | tee /tmp/bench.log
      - name: criterion 目标编译校验 (若存在)
        run: |
          set -euo pipefail
          if compgen -G "crates/*/benches/*.rs" > /dev/null || compgen -G "benches/*.rs" > /dev/null; then
            cargo bench --workspace --locked
          else
            echo "::notice::尚无 criterion 基准用例(benches/*.rs); DoD 4 的 3% 回归阈值见下方口径声明"
          fi
      - name: 测量结果 + 口径声明
        if: always()
        run: |
          {
            echo '### BASELINE 读数 (数量级, 不是达标判定)'
            echo ''
            echo '```text'
            grep -E '^BENCH ' /tmp/bench.log 2>/dev/null || echo '(没有捕获到 BENCH 行)'
            echo '```'
            echo ''
            echo '**运行环境**: GitHub 托管 runner (ubuntu-latest)。CPU 型号共享且频率不固定,'
            echo '因此读数只能给**数量级**, **不能**用来判定 BASELINE-001 的 ">=100x 实时" 是否达标。'
            echo ''
            echo '**DoD 4 的 "衰退不得超过 3%"** 需要**可比的固定硬件**才成立(自托管 runner 或指定参考机)。'
            echo '托管 runner 上不同次运行的 CPU 漂移远超 3%, 该阈值在本 CI 上**不可判定**, 记为 pending;'
            echo '不要把它读成"通过"或"不通过"。'
            echo ''
            echo '**复跑方式**: cargo run --release -p yeban-render --example bench_render -- <轨数> <秒数>'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 模糊测试 (MUST-GATE-011): 独立 fuzz workspace, 需要 nightly + cargo-fuzz
  # ---------------------------------------------------------------------------
  fuzz:
    name: fuzz (cargo-fuzz, ${{ inputs.fuzz_seconds }}s)
    if: inputs.gate == 'fuzz'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: 安装 nightly 与 cargo-fuzz
        run: |
          set -euo pipefail
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: 跑 SFZ 解析器模糊测试 (零崩溃 = 通过)
        working-directory: crates/yeban-sfz
        run: |
          set -euo pipefail
          # cargo-fuzz 是独立 workspace (自带 [workspace]), 因此这里有它自己的 target/。
          cargo +nightly fuzz run sfz_parse -- -max_total_time=${{ inputs.fuzz_seconds }} -print_final_stats=1
      - name: 失败时保留语料 (崩溃样本是最有价值的产物)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: crates/yeban-sfz/fuzz/artifacts
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 确定性对账 (L1/L2): 目前无渲染器, 明确列为 PENDING
  # ---------------------------------------------------------------------------
  determinism:
    name: determinism (PENDING)
    if: inputs.gate == 'determinism'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 未接线说明
        run: |
          {
            echo "### 未执行: 确定性对账 (MUST-GATE-002 / MUST-GATE-003)"
            echo ""
            echo "阻断项:"
            echo "1. `yeban-render` 尚未实现, 没有可对账的渲染输出;"
            echo "2. L1 需要在锁定 ISA/工具链的固定频率机器上产出参考短语 WAV 的 SHA-256;"
            echo "3. L2 需要 x86_64 与 AArch64 两个 runner 同时产出并对账 (< 1e-6)。"
            echo ""
            echo "登记位置: docs/DEVELOPMENT_LEDGER.md 的 pending 清单。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::determinism 门禁尚未接线 (PENDING), 详见 job summary"

  # ---------------------------------------------------------------------------
  # 一次性列出全部 PENDING 门禁, 方便人类决定补哪块基础设施
  # ---------------------------------------------------------------------------
  pending:
    name: pending (待补基础设施清单)
    if: inputs.gate == 'pending'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 校验门禁状态表本身没有腐烂
        run: python3 scripts/gates/check_gate_status.py
      - name: 渲染门禁状态表 (单一事实源) + 列出账本里仍未闭环的 PENDING
        run: |
          set -euo pipefail
          {
            echo "## 门禁状态 (来自 docs/ledger/gate-status.md)"
            echo ""
            cat docs/ledger/gate-status.md
            echo ""
            echo "---"
            echo "## 账本里仍未闭环的 PENDING (原始留痕, 供交叉核对)"
            echo '```text'
            grep -rn "PENDING" docs/DEVELOPMENT_LEDGER.md | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
