# 夜半 (Yeban) 每夜构建 —— main 一推就编 nightly 二进制，别人直接下 nightly 就是 main 最新。
#
# 对标偃师 (Yanshi) 的 nightly.yml（2026-10-30 设计），按夜半仓库的既有约定改写。
# 与偃师版的**三处有意不同**（不是照搬漏了，是夜半现状决定的取舍）：
#   ① 五个平台（2 linux + 2 macOS + 1 Windows x86_64）。偃师是四平台矩阵；夜半
#      release.yml 的 plan job 不再拦任何一腿：linux 两腿：x86_64 原生 + aarch64
#      原生（runner 用 gates-manual 的 arm 档已在用的 ubuntu-24.04-arm）。macOS 两腿
#      （Wang 2026-11-01 确认）：aarch64 原生（ci.yml 的 macos 腿已在 macos-latest
#      上编 yeban-app，有证据）+ x86_64 在 macos-15 上交叉编（--target，新增腿，由
#      本 nightly 腿自己证明）。Windows 腿（Wang 2026-11-01 确认）：原生
#      windows-latest，ci.yml 的 windows 腿已编 yeban-app，有证据；libclang 用 ci.yml
#      同款 pwsh 发现逻辑（复用镜像 LLVM，否则 choco 装）。Windows ARM 不在内（须
#      付费大 runner，Wang 没开口就不加）。
#      五个平台的包都是**未签名**的 nightly（仓库无 codesign 凭据）：nightly 不是
#      正式 release，用户须手动放行；要签名分发等 release.yml 的各平台路打通后再说。
#      加目标时同步改下面的 matrix、artifact 名与发布校验里的归档数断言。
#   ② 不重跑 release.yml 的重门禁（guards / deny / clippy --workspace / test --workspace）。
#      那些判据在 main 每次 push 时已经由 ci.yml 跑过；nightly 只做"把 main 的树用默认
#      feature 真编译一次、打成可核对的包"。夜半 nightly ≠ 夜半 release：release 的
#      MUST-GATE-009 三重证明、版本三处对账、draft→publish 顺序仍只住在 release.yml。
#   ③ 权限比偃师版更严：顶层 contents: read，只给 publish job 开 contents: write
#     （照抄 release.yml 的 release job，不照抄偃师版顶层 write）。
#
# **触发**：push 到 main ＋ 手工 dispatch。
#   文档-only 推送不编（**/*.md 不改二进制；与偃师 nightly 同口径）。
#   分支 push 不触发：分支验证走 workflow_dispatch（见发布门）。
# **只编最新**：concurrency 组 nightly-<ref>、cancel-in-progress true ⇒
#   正在编时又推上来，取消前面的、只编最新的。
#   ⚠ 这与 release.yml 的 cancel-in-progress: false **不冲突**：release 绝不能半途被掐
#   （会留半份产物）；nightly 的 publish job 在全部构建完成之后才跑，被取消的 run
#   永远到不了 publish ⇒ 同样留不下半更新的 Release。
# **删后重建**：`gh release edit` 不动 published_at，页面边栏日期永远停在首次创建日
#   （实测：Release 创建于 2026-11-02，11-03 的资产已是最新，边栏仍显示“2 days ago”）。
#   故 publish 改为先 delete（--cleanup-tag 连 tag 一并删）再 create：边栏日期＝本次
#   创建日，tag 也随 create 落在本次 SHA。代价：publish 中途失败会留空缺（无 Release
#   或资产不全），下次 main 推送的 publish 重建完整一套；publish 只在 5 归档全验后、
#   构建全绿时才跑。
# **分支 dispatch 只编不发**：publish 作业 gate 在 `github.ref == 'refs/heads/main'` ⇒
#   分支上 dispatch 只能验证构建路，绝不会把分支二进制发成 nightly。
#   合入后的第一次证明，是合入后 main 上第一次 push 触发的 run 真正发了 nightly。
# **构建路复用 release.yml**：同一批 apt 前置、同一条 `cargo build --release --locked
#   -p yeban-app -p yeban-mcp`（默认 feature，绝不加 --features）、同一个 tar 复现约定
#  （--sort=name + --mtime=SOURCE_DATE_EPOCH，值 1759638400 与 release.yml /
#   gates-manual.yml 是同一个仓库既有变量）、同一个包内布局（yeban-app、yeban-mcp、
#   LICENSE、BUILD-INFO.txt）。改动打包路时两边要同步改，并说明理由。
# **归档名稳定 ⇒ 无需清理旧包**：偃师版要删旧归档，是因为它的归档名里带 commit 短哈希；
#   夜半归档名是 yeban-<工作区版本>-<目标>.tar.gz（版本在两次发版之间不变），
#   新 Release 里只有本次 5 个归档＋SHA256SUMS ⇒ Release 里永远只有最新一套包。
# **冒烟**：解包后跑包里的 yeban-app --version，与工作区清单版本逐字比对
#  （release.yml 的版本对账同款判据；yeban-mcp 没有 --version 开关，不拿它冒烟，
#   只验它在包里存在且可执行）。
# **供应链**：建 Release 用 runner 自带的 `gh`，不引入第三方 action
#   （与 release.yml 同规则）；产物搬运用 actions/download-artifact 与
#   actions/upload-artifact（release.yml 亦如此）。
# **只改 CI/CD 配置的提交**：run 只要能启动即可（见 release.yml 头部规则）——
#   但 nightly 的 dispatch 验证例外：它就是为了验证构建路，必须真跑完构建作业。

name: Nightly

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 仓库既有的复现变量（release.yml 与 gates-manual.yml 用同一个值）。这里同时用作 tar 的 --mtime。
  SOURCE_DATE_EPOCH: 1759638400

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    # 与 release.yml 的 build 腿同为 150：冷编 yeban-app（含 Slint 等重依赖、无缓存）
    # 不是 60 分钟能稳过的量，超时只会让 nightly 无故断供。
    timeout-minutes: 150
    strategy:
      # 一腿红不掐另一腿：两腿的证据都要留下（尤其 arm64 是新增腿）。
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cargo_flag: ""
            bindir: target/release
            exe: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            cargo_flag: ""
            bindir: target/release
            exe: ""
          - runner: macos-15
            target: aarch64-apple-darwin
            cargo_flag: ""
            bindir: target/release
            exe: ""
          - runner: macos-15
            target: x86_64-apple-darwin
            cargo_flag: "--target x86_64-apple-darwin"
            bindir: target/x86_64-apple-darwin/release
            exe: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            cargo_flag: ""
            bindir: target/release
            exe: ".exe"
    steps:
      - uses: actions/checkout@v4

      - name: 工具链漂移断言（与 release.yml 同一个判据：单一事实源 rust-toolchain.toml）
        shell: bash
        run: |
          set -euo pipefail
          rustup show
          want="$(grep -oE 'channel = "[^"]+"' rust-toolchain.toml | head -1 | cut -d'"' -f2)"
          got="$(rustc --version | awk '{print $2}')"
          echo "pinned=$want actual=$got"
          [ "$want" = "$got" ] || { echo "::error::工具链漂移, L1 声学确定性要求锁定工具链"; exit 1; }

      - name: 安装 Linux 桌面构建依赖（与 release.yml 的 build job 逐字相同）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # 缺 fontconfig 会在"编译依赖"阶段红（不是我们的代码错）；
          # fonts-noto-cjk 是运行时环境依赖（ADR-0001 D24），缺了中文 Golden 会稳定地记录错误。
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libgl1-mesa-dev \
            libasound2-dev \
            clang libclang-dev \
            fonts-noto-cjk

      - name: libclang（macOS bindgen 前置；ci.yml 的 macos 腿同款发现逻辑）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # macOS 上 libclang 不在 SDK 里，逐个候选并**验证**它真含 libclang.dylib，
          # 否则 bindgen 会在编译 signalsmith-stretch 时失败（ci.yml 的 macos 腿曾因此红一次）。
          cands=()
          if command -v brew >/dev/null 2>&1; then
            p="$(brew --prefix llvm 2>/dev/null || true)"; [ -n "$p" ] && cands+=("$p/lib")
            p="$(brew --prefix llvm@18 2>/dev/null || true)"; [ -n "$p" ] && cands+=("$p/lib")
          fi
          cands+=("$(xcode-select -p)/usr/lib")
          cands+=("$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib")
          cands+=("/opt/homebrew/opt/llvm/lib" "/usr/local/opt/llvm/lib")
          found=""
          for c in "${cands[@]}"; do
            if [ -e "$c/libclang.dylib" ] || [ -e "$c/libclang.1.dylib" ]; then found="$c"; break; fi
          done
          if [ -z "$found" ]; then
            echo "::error::找不到 libclang.dylib；已试: ${cands[*]}"
            exit 1
          fi
          echo "LIBCLANG_PATH=$found" >> "$GITHUB_ENV"
          echo "libclang: $found"

      - name: libclang（Windows bindgen 前置；ci.yml 的 windows 腿同款 pwsh 发现逻辑）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # [ARCH-DSP-004 / HD-44=A] 实测: 该依赖用 cc 编 C++ + bindgen 生成绑定 ⇒ 需要 libclang。
          # 镜像若已带 LLVM 就复用, 否则用 choco 安装; 无论哪条路都把 LIBCLANG_PATH 导给后续步骤。
          $candidates = @('C:\Program Files\LLVM\bin', 'C:\Program Files (x86)\LLVM\bin')
          $found = $candidates | Where-Object { Test-Path (Join-Path $_ 'libclang.dll') } | Select-Object -First 1
          if (-not $found) {
            choco install llvm -y --no-progress
            $found = $candidates | Where-Object { Test-Path (Join-Path $_ 'libclang.dll') } | Select-Object -First 1
          }
          if (-not $found) { Write-Error 'libclang.dll 未找到 ⇒ bindgen 会失败'; exit 1 }
          "LIBCLANG_PATH=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "LIBCLANG_PATH=$found"

      - name: 交叉目标 std（只给 x86_64-apple-darwin 腿）
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          rustup target add x86_64-apple-darwin

      - name: python3 垫片（只给 Windows 腿；Git Bash 未必有 python3）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # windows-latest 的 Python 在 PATH 里未必叫 python3；没有就用 py 启动器垫一个，
          # 让后面打包/冒烟里的 python3 调用在三平台上同一写法。
          if ! command -v python3 >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/shim"
            printf '#!/bin/sh\nexec py -3 "$@"\n' > "$RUNNER_TEMP/shim/python3"
            chmod +x "$RUNNER_TEMP/shim/python3"
            echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"
            echo "python3 垫片已装（py -3）"
          else
            echo "python3 已存在，不垫"
          fi

      - name: 发行构建（默认 feature 专用：绝不加 --all-features / 绝不加任何 --features）
        shell: bash
        run: |
          set -euo pipefail
          # MUST-GATE-009 的第一道开关就是"编译期不把危险能力编进去" ⇒ 这里只能是默认 feature。
          # `--locked` + 钉死工具链 = 仓库既有的复现约定。
          # matrix.cargo_flag 只在 x86_64-apple-darwin 腿上是 --target（交叉编），其余腿为空；
          # 它不是 --features，绝不往里塞 feature 开关。
          cargo build --release --locked ${{ matrix.cargo_flag }} -p yeban-app -p yeban-mcp
          ls -l "${{ matrix.bindir }}/yeban-app" "${{ matrix.bindir }}/yeban-mcp"

      - name: 打包 + sha256（Linux 腿可复现 tar；macOS/Windows 腿 BSD tar 布局相同）
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          # 版本唯一事实源 = 根 Cargo.toml 的 [workspace.package] version（与 release.yml plan job 同款读法）。
          VERSION="$(python3 - <<'PY'
          try:
              import tomllib
          except ModuleNotFoundError:
              import sys
              print("::error::无法从根 Cargo.toml 读版本（需要 python3 >= 3.11 的 tomllib）", file=sys.stderr)
              raise SystemExit(3)
          import pathlib
          print(tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))["workspace"]["package"]["version"])
          PY
          )"
          TARGET="${{ matrix.target }}"
          NAME="yeban-${VERSION}-${TARGET}"
          mkdir -p dist

          mkdir -p "stage/$NAME"
          install -m 0755 "${{ matrix.bindir }}/yeban-app${{ matrix.exe }}" "stage/$NAME/yeban-app${{ matrix.exe }}"
          install -m 0755 "${{ matrix.bindir }}/yeban-mcp${{ matrix.exe }}" "stage/$NAME/yeban-mcp${{ matrix.exe }}"
          # GPLv3 再分发：许可原文随包。缺了它宁可不发（LICENSE 是红线 1 保护文件，只读不动）。
          install -m 0644 LICENSE "stage/$NAME/LICENSE"

          # 随包证据：让"这个包凭什么可发"在包里可读，而不是只存在于 CI 日志里。
          # ⚠ nightly 不是 release：这里不写 MUST-GATE-009 的证明（那是 release.yml 的职责），
          #   只写"默认档构建"这一事实 + 两个二进制的哈希；要 009 证明就去看对应版本的 release。
          {
            printf '夜半 (Yeban) nightly %s\n' "$VERSION"
            printf 'target: %s\n' "$TARGET"
            printf 'source commit: %s\n' "${GITHUB_SHA}"
            printf 'rustc: %s\n' "$(rustc --version)"
            printf 'built at (SOURCE_DATE_EPOCH=%s): %s\n' "$SOURCE_DATE_EPOCH" "$(python3 -c 'import datetime, os; print(datetime.datetime.fromtimestamp(int(os.environ["SOURCE_DATE_EPOCH"]), datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))')"
            printf 'features: 默认档 only —— in-process-mcp / experimental-als-export / experimental-logic-export 均未编译\n'
            printf 'sha256(yeban-app): %s\n' "$(python3 -c "import hashlib; print(hashlib.sha256(open('stage/$NAME/yeban-app${{ matrix.exe }}','rb').read()).hexdigest())")"
            printf 'sha256(yeban-mcp): %s\n' "$(python3 -c "import hashlib; print(hashlib.sha256(open('stage/$NAME/yeban-mcp${{ matrix.exe }}','rb').read()).hexdigest())")"
          } > "stage/$NAME/BUILD-INFO.txt"

          # 哈希与打包一律用 python3 + tar 的跨平台写法：macOS 没有 GNU sha256sum
          # 与 GNU timeout；macOS 与 Windows Git Bash 的 tar 都是 BSD 系，不认
          # --sort/--mtime/--format=gnu。只有 Linux 腿用 GNU tar 可复现约定，其余腿
          # 布局相同，只是不做字节级可复现。
          if [ "$(uname)" = Linux ]; then
            tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
                --format=gnu -czf "dist/$NAME.tar.gz" -C stage "$NAME"
          else
            tar -czf "dist/$NAME.tar.gz" -C stage "$NAME"
          fi
          ( cd dist && python3 -c "import hashlib; print(hashlib.sha256(open('$NAME.tar.gz','rb').read()).hexdigest() + '  $NAME.tar.gz')" > "$NAME.tar.gz.sha256" )
          SHA="$(cut -d' ' -f1 < "dist/$NAME.tar.gz.sha256")"
          {
            echo "### nightly 归档"
            echo ""
            echo '| 文件 | 字节 (wc -c) | sha256 |'
            echo '| :--- | ---: | :--- |'
            printf '| `%s.tar.gz` | %s | `%s` |\n' "$NAME" "$(wc -c < "dist/$NAME.tar.gz" | tr -d ' ')" "$SHA"
          } 2>&1 | tee /tmp/nightly-pack.txt
          cat /tmp/nightly-pack.txt >> "$GITHUB_STEP_SUMMARY"

      - name: 校验归档 + 冒烟（解包后跑包里的 yeban-app --version，对清单版本）
        shell: bash
        env:
          # Windows runner 的 Python stdout 缺省是 cp1252，本步 heredoc 里有中文打印
          #（sha256 自验通过），不置 UTF-8 会在 Windows 腿上以 UnicodeEncodeError 失败。
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          ls -la dist
          test -n "$(ls dist/*.tar.gz 2>/dev/null)" || { echo "✗ dist 里没有归档 ⇒ 打包没成功"; exit 1; }
          test -f dist/*.tar.gz.sha256 || { echo "✗ 没有随包 sha256 ⇒ 校验和缺失"; exit 1; }
          # 随包自验（python3 跨平台写法；macOS 没有 GNU sha256sum）。
          ( cd dist && python3 - <<'PY'
          import glob, hashlib
          for f in glob.glob('*.sha256'):
              want, name = open(f).read().strip().split(None, 1)
              got = hashlib.sha256(open(name.strip(), 'rb').read()).hexdigest()
              assert got == want, f"{name}: {got} != {want}"
          print("sha256 自验通过")
          PY
          )
          for f in dist/*.tar.gz; do
            echo "-- 校验归档：$f"
            tar -tzf "$f" >/dev/null
          done
          # 冒烟：包里的二进制必须能跑，且自报版本必须等于工作区清单版本。
          # yeban-app --version 在无显示的 runner 上也能跑（release.yml 的版本对账同款用法）；
          # yeban-mcp 没有 --version 开关，只验存在与可执行位。
          work=$(mktemp -d)
          tar -xzf dist/*.tar.gz -C "$work"
          root=$(find "$work" -maxdepth 1 -type d -name 'yeban-*' | head -1)
          test -n "$root" || { echo "✗ 解包后找不到 yeban-* 目录"; exit 1; }
          test -x "$root/yeban-app${{ matrix.exe }}" || { echo "✗ 包里的 yeban-app 不可执行"; exit 1; }
          test -x "$root/yeban-mcp${{ matrix.exe }}" || { echo "✗ 包里的 yeban-mcp 不可执行"; exit 1; }
          VERSION="$(python3 - <<'PY'
          try:
              import tomllib
          except ModuleNotFoundError:
              import sys
              print("::error::无法从根 Cargo.toml 读版本（需要 python3 >= 3.11 的 tomllib）", file=sys.stderr)
              raise SystemExit(3)
          import pathlib
          print(tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))["workspace"]["package"]["version"])
          PY
          )"
          # 30 秒超时保护用 python3 包一层：macOS 没有 GNU timeout。
          BIN_LINE="$(python3 -c "import subprocess, sys; print(subprocess.run(sys.argv[1:], capture_output=True, text=True, timeout=30).stdout.strip())" "$root/yeban-app${{ matrix.exe }}" --version)"
          echo "--- 包内 yeban-app --version ---"
          echo "$BIN_LINE"
          [ "$BIN_LINE" = "yeban-app $VERSION" ] \
            || { echo "::error::包内二进制的自报版本 '$BIN_LINE' 与清单版本 'yeban-app $VERSION' 不一致 ⇒ 拒绝发布"; exit 1; }
          echo "✓ 冒烟通过：包能解、yeban-app --version 与清单版本一致 ✓"

      - name: 上传归档（artifact；发布是 publish job 的事）
        uses: actions/upload-artifact@v4
        with:
          name: yeban-nightly-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 发布（滚动 nightly Release）
  #
  # - 不用第三方 release action：`gh` + `GITHUB_TOKEN`（contents: write 只给这一个 job）。
  # - 顺序是"构建全绿 → 取回校验 → 更新 Release" ⇒ 中途红不会留下半份可见发行物。
  # - 归档名稳定（yeban-<版本>-<目标>.tar.gz），同名 --clobber 即覆盖 ⇒ 不需要删旧包。
  # - 说明写 commit + 构建时间（UTC）：Release 页一眼能看出这是哪次 main 的包。
  # ---------------------------------------------------------------------------
  publish:
    name: publish the rolling nightly release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: yeban-nightly-*
          path: artifacts

      - name: 校验取回的归档并更新 nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          find artifacts -name '*.tar.gz' | sort | tee /tmp/nightly-archives.txt
          n_archives=$(wc -l < /tmp/nightly-archives.txt | tr -d ' ')
          echo "归档数 $n_archives"
          # v1 五个平台：归档数不是 5 就是构建腿或取回腿漂移了 ⇒ 不许发布。
          [ "$n_archives" -eq 5 ] || { echo "✗ 归档数 $n_archives ≠ 5 ⇒ 不许发布（加平台时同步改这里的断言）" >&2; exit 1; }
          find artifacts -name '*.sha256' -exec cat {} \; > SHA256SUMS
          cat SHA256SUMS
          # 自校验：每个归档都在自己的 artifact 目录里凭随包 .sha256 验一遍（证明传输没坏）。
          # ⛔ 不再与 build job 的 outputs 逐字比对：矩阵腿的 outputs 不能以 needs.build.outputs
          # 单值寻址；监管链是 .sha256 文件由同一 build 腿生成、随同一 artifact 取回。
          for f in $(cat /tmp/nightly-archives.txt); do
            ( cd "$(dirname "$f")" && sha256sum -c ./*.sha256 )
          done
          NOTES="Rolling nightly build from main.
          Commit: ${GITHUB_SHA}
          Built at (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # 删后重建（见文件头“删后重建”）：edit 不动 published_at，故先删再建；
          # create 会把 tag 建在本次 SHA，不再需要 tag PATCH。
          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete nightly --yes --cleanup-tag --repo "$GITHUB_REPOSITORY"
          fi
          gh release create nightly --title "nightly" --notes "$NOTES" --target "${GITHUB_SHA}" --repo "$GITHUB_REPOSITORY"
          for f in $(find artifacts -name '*.tar.gz' | sort); do
            gh release upload nightly "$f" --repo "$GITHUB_REPOSITORY"
          done
          gh release upload nightly SHA256SUMS --repo "$GITHUB_REPOSITORY"
          echo "== 滚动 nightly 已更新 ✓（commit ${GITHUB_SHA}，$n_archives 个平台归档）=="
