# 夜半 (Yeban) 每夜构建 —— main 一推就编 nightly 二进制，别人直接下 nightly 就是 main 最新。
#
# 对标偃师 (Yanshi) 的 nightly.yml（2026-10-30 设计），按夜半仓库的既有约定改写。
# 与偃师版的**三处有意不同**（不是照搬漏了，是夜半现状决定的取舍）：
#   ① 只要 linux-x86_64 一个平台。偃师是四平台矩阵；夜半 release.yml 的 plan  job
#      已逐条证明：今天唯一有 CI 证据能编 yeban-app 的目标就是 x86_64-unknown-linux-gnu，
#      macOS（未在 CI 编过 app、缺 codesign/notarize 凭据）、Windows（app 从未在
#      windows-latest 上编过）、arm64（app 从未在 ARM runner 上编过）今天都发不了。
#      nightly 照抄四平台矩阵只会造出三个从未验证过的构建腿 ⇒ v1 只做有证据的一条，
#      其余目标等 release.yml 的"未来目标"表逐项打通后再加（加目标时同步改下面的
#      TARGET、artifact 名与发布校验里的归档数断言）。
#   ② 不重跑 release.yml 的重门禁（guards / deny / clippy --workspace / test --workspace）。
#      那些判据在 main 每次 push 时已经由 ci.yml 跑过；nightly 只做"把 main 的树用默认
#      feature 真编译一次、打成可核对的包"。夜半 nightly ≠ 夜半 release：release 的
#      MUST-GATE-009 三重证明、版本三处对账、draft→publish 顺序仍只住在 release.yml。
#   ③ 权限比偃师版更严：顶层 contents: read，只给 publish job 开 contents: write
#     （照抄 release.yml 的 release job，不照抄偃师版顶层 write）。
#
# **触发**：push 到 main ＋ 手工 dispatch。
#   文档-only 推送不编（**/*.md 不改二进制；与偃师 nightly 同口径）。
#   分支 push 不触发：分支验证走 workflow_dispatch（见发布门）。
# **只编最新**：concurrency 组 nightly-<ref>、cancel-in-progress true ⇒
#   正在编时又推上来，取消前面的、只编最新的。
#   ⚠ 这与 release.yml 的 cancel-in-progress: false **不冲突**：release 绝不能半途被掐
#   （会留半份产物）；nightly 的 publish job 在全部构建完成之后才跑，被取消的 run
#   永远到不了 publish ⇒ 同样留不下半更新的 Release。
# **绝不半新半旧**：一个 publish 作业统一更新滚动 Release（构建 job 全绿是它的 needs）。
# **分支 dispatch 只编不发**：publish 作业 gate 在 `github.ref == 'refs/heads/main'` ⇒
#   分支上 dispatch 只能验证构建路，绝不会把分支二进制发成 nightly。
#   合入后的第一次证明，是合入后 main 上第一次 push 触发的 run 真正发了 nightly。
# **构建路复用 release.yml**：同一批 apt 前置、同一条 `cargo build --release --locked
#   -p yeban-app -p yeban-mcp`（默认 feature，绝不加 --features）、同一个 tar 复现约定
#  （--sort=name + --mtime=SOURCE_DATE_EPOCH，值 1759638400 与 release.yml /
#   gates-manual.yml 是同一个仓库既有变量）、同一个包内布局（yeban-app、yeban-mcp、
#   LICENSE、BUILD-INFO.txt）。改动打包路时两边要同步改，并说明理由。
# **归档名稳定 ⇒ 无需清理旧包**：偃师版要删旧归档，是因为它的归档名里带 commit 短哈希；
#   夜半归档名是 yeban-<工作区版本>-<目标>.tar.gz（版本在两次发版之间不变），
#   `gh release upload --clobber` 同名即覆盖 ⇒ Release 里永远只有最新一套包。
# **冒烟**：解包后跑包里的 yeban-app --version，与工作区清单版本逐字比对
#  （release.yml 的版本对账同款判据；yeban-mcp 没有 --version 开关，不拿它冒烟，
#   只验它在包里存在且可执行）。
# **供应链**：建 Release 用 runner 自带的 `gh`，不引入第三方 action
#   （与 release.yml 同规则）；产物搬运用 actions/download-artifact 与
#   actions/upload-artifact（release.yml 亦如此）。
# **只改 CI/CD 配置的提交**：run 只要能启动即可（见 release.yml 头部规则）——
#   但 nightly 的 dispatch 验证例外：它就是为了验证构建路，必须真跑完构建作业。

name: Nightly

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 仓库既有的复现变量（release.yml 与 gates-manual.yml 用同一个值）。这里同时用作 tar 的 --mtime。
  SOURCE_DATE_EPOCH: 1759638400

jobs:
  build:
    name: build (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    # 与 release.yml 的 build 腿同为 150：冷编 yeban-app（含 Slint 等重依赖、无缓存）
    # 不是 60 分钟能稳过的量，超时只会让 nightly 无故断供。
    timeout-minutes: 150
    outputs:
      archive: ${{ steps.pack.outputs.archive }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: 工具链漂移断言（与 release.yml 同一个判据：单一事实源 rust-toolchain.toml）
        run: |
          set -euo pipefail
          rustup show
          want="$(grep -oE 'channel = "[^"]+"' rust-toolchain.toml | head -1 | cut -d'"' -f2)"
          got="$(rustc --version | awk '{print $2}')"
          echo "pinned=$want actual=$got"
          [ "$want" = "$got" ] || { echo "::error::工具链漂移, L1 声学确定性要求锁定工具链"; exit 1; }

      - name: 安装 Linux 桌面构建依赖（与 release.yml 的 build job 逐字相同）
        run: |
          set -euo pipefail
          # 缺 fontconfig 会在"编译依赖"阶段红（不是我们的代码错）；
          # fonts-noto-cjk 是运行时环境依赖（ADR-0001 D24），缺了中文 Golden 会稳定地记录错误。
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev \
            libasound2-dev \
            clang libclang-dev \
            fonts-noto-cjk

      - name: 发行构建（默认 feature 专用：绝不加 --all-features / 绝不加任何 --features）
        run: |
          set -euo pipefail
          # MUST-GATE-009 的第一道开关就是"编译期不把危险能力编进去" ⇒ 这里只能是默认 feature。
          # `--locked` + 钉死工具链 = 仓库既有的复现约定。
          cargo build --release --locked -p yeban-app -p yeban-mcp
          ls -l target/release/yeban-app target/release/yeban-mcp

      - name: 打包 + sha256（可复现 tar：--sort=name + --mtime=SOURCE_DATE_EPOCH）
        id: pack
        run: |
          set -euo pipefail
          # 版本唯一事实源 = 根 Cargo.toml 的 [workspace.package] version（与 release.yml plan job 同款读法）。
          VERSION="$(python3 - <<'PY'
          try:
              import tomllib
          except ModuleNotFoundError:
              import sys
              print("::error::无法从根 Cargo.toml 读版本（需要 python3 >= 3.11 的 tomllib）", file=sys.stderr)
              raise SystemExit(3)
          import pathlib
          print(tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))["workspace"]["package"]["version"])
          PY
          )"
          TARGET="x86_64-unknown-linux-gnu"
          NAME="yeban-${VERSION}-${TARGET}"
          mkdir -p dist

          mkdir -p "stage/$NAME"
          install -m 0755 target/release/yeban-app "stage/$NAME/yeban-app"
          install -m 0755 target/release/yeban-mcp "stage/$NAME/yeban-mcp"
          # GPLv3 再分发：许可原文随包。缺了它宁可不发（LICENSE 是红线 1 保护文件，只读不动）。
          install -m 0644 LICENSE "stage/$NAME/LICENSE"

          # 随包证据：让"这个包凭什么可发"在包里可读，而不是只存在于 CI 日志里。
          # ⚠ nightly 不是 release：这里不写 MUST-GATE-009 的证明（那是 release.yml 的职责），
          #   只写"默认档构建"这一事实 + 两个二进制的哈希；要 009 证明就去看对应版本的 release。
          {
            printf '夜半 (Yeban) nightly %s\n' "$VERSION"
            printf 'target: %s\n' "$TARGET"
            printf 'source commit: %s\n' "${GITHUB_SHA}"
            printf 'rustc: %s\n' "$(rustc --version)"
            printf 'built at (SOURCE_DATE_EPOCH=%s): %s\n' "$SOURCE_DATE_EPOCH" "$(python3 -c 'import datetime, os; print(datetime.datetime.fromtimestamp(int(os.environ["SOURCE_DATE_EPOCH"]), datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))')"
            printf 'features: 默认档 only —— in-process-mcp / experimental-als-export / experimental-logic-export 均未编译\n'
            printf 'sha256(yeban-app): %s\n' "$(sha256sum "stage/$NAME/yeban-app" | cut -d' ' -f1)"
            printf 'sha256(yeban-mcp): %s\n' "$(sha256sum "stage/$NAME/yeban-mcp" | cut -d' ' -f1)"
          } > "stage/$NAME/BUILD-INFO.txt"

          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
              --format=gnu -czf "dist/$NAME.tar.gz" -C stage "$NAME"
          ( cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256" )
          SHA="$(cut -d' ' -f1 < "dist/$NAME.tar.gz.sha256")"
          printf 'archive=%s.tar.gz\nsha256=%s\n' "$NAME" "$SHA" >> "$GITHUB_OUTPUT"

          {
            echo "### nightly 归档"
            echo ""
            echo '| 文件 | 字节 (wc -c) | sha256 |'
            echo '| :--- | ---: | :--- |'
            printf '| `%s.tar.gz` | %s | `%s` |\n' "$NAME" "$(wc -c < "dist/$NAME.tar.gz" | tr -d ' ')" "$SHA"
          } 2>&1 | tee /tmp/nightly-pack.txt
          cat /tmp/nightly-pack.txt >> "$GITHUB_STEP_SUMMARY"

      - name: 校验归档 + 冒烟（解包后跑包里的 yeban-app --version，对清单版本）
        run: |
          set -euo pipefail
          ls -la dist
          test -n "$(ls dist/*.tar.gz 2>/dev/null)" || { echo "✗ dist 里没有归档 ⇒ 打包没成功"; exit 1; }
          test -f dist/*.tar.gz.sha256 || { echo "✗ 没有随包 sha256 ⇒ 校验和缺失"; exit 1; }
          ( cd dist && sha256sum -c ./*.sha256 )
          for f in dist/*.tar.gz; do
            echo "-- 校验归档：$f"
            tar -tzf "$f" >/dev/null
          done
          # 冒烟：包里的二进制必须能跑，且自报版本必须等于工作区清单版本。
          # yeban-app --version 在无显示的 runner 上也能跑（release.yml 的版本对账同款用法）；
          # yeban-mcp 没有 --version 开关，只验存在与可执行位。
          work=$(mktemp -d)
          tar -xzf dist/*.tar.gz -C "$work"
          root=$(find "$work" -maxdepth 1 -type d -name 'yeban-*' | head -1)
          test -n "$root" || { echo "✗ 解包后找不到 yeban-* 目录"; exit 1; }
          test -x "$root/yeban-app" || { echo "✗ 包里的 yeban-app 不可执行"; exit 1; }
          test -x "$root/yeban-mcp" || { echo "✗ 包里的 yeban-mcp 不可执行"; exit 1; }
          VERSION="$(python3 - <<'PY'
          try:
              import tomllib
          except ModuleNotFoundError:
              import sys
              print("::error::无法从根 Cargo.toml 读版本（需要 python3 >= 3.11 的 tomllib）", file=sys.stderr)
              raise SystemExit(3)
          import pathlib
          print(tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))["workspace"]["package"]["version"])
          PY
          )"
          BIN_LINE="$(timeout 30 "$root/yeban-app" --version)"
          echo "--- 包内 yeban-app --version ---"
          echo "$BIN_LINE"
          [ "$BIN_LINE" = "yeban-app $VERSION" ] \
            || { echo "::error::包内二进制的自报版本 '$BIN_LINE' 与清单版本 'yeban-app $VERSION' 不一致 ⇒ 拒绝发布"; exit 1; }
          echo "✓ 冒烟通过：包能解、yeban-app --version 与清单版本一致 ✓"

      - name: 上传归档（artifact；发布是 publish job 的事）
        uses: actions/upload-artifact@v4
        with:
          name: yeban-nightly-x86_64-unknown-linux-gnu
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 发布（滚动 nightly Release）
  #
  # - 不用第三方 release action：`gh` + `GITHUB_TOKEN`（contents: write 只给这一个 job）。
  # - 顺序是"构建全绿 → 取回校验 → 更新 Release" ⇒ 中途红不会留下半份可见发行物。
  # - 归档名稳定（yeban-<版本>-<目标>.tar.gz），同名 --clobber 即覆盖 ⇒ 不需要删旧包。
  # - 说明写 commit + 构建时间（UTC）：Release 页一眼能看出这是哪次 main 的包。
  # ---------------------------------------------------------------------------
  publish:
    name: publish the rolling nightly release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: yeban-nightly-*
          path: artifacts

      - name: 校验取回的归档并更新 nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          find artifacts -name '*.tar.gz' | sort | tee /tmp/nightly-archives.txt
          n_archives=$(wc -l < /tmp/nightly-archives.txt | tr -d ' ')
          echo "归档数 $n_archives"
          # v1 只有一个平台：归档数不是 1 就是构建腿或取回腿漂移了 ⇒ 不许发布。
          [ "$n_archives" -eq 1 ] || { echo "✗ 归档数 $n_archives ≠ 1 ⇒ 不许发布（加平台时同步改这里的断言）" >&2; exit 1; }
          find artifacts -name '*.sha256' -exec cat {} \; > SHA256SUMS
          cat SHA256SUMS
          # 自校验：证明传输没坏；再与构建 job 输出的摘要逐字比对（证明贴的就是 build 判过的那份字节）。
          ( cd "$(dirname "$(find artifacts -name '*.tar.gz' | head -1)")" && sha256sum -c ./*.sha256 )
          expected="${{ needs.build.outputs.sha256 }}"
          actual="$(cut -d' ' -f1 < SHA256SUMS)"
          echo "expected=$expected"
          echo "actual  =$actual"
          [ "$expected" = "$actual" ] || { echo "::error::publish job 拿到的摘要与 build job 的不一致"; exit 1; }
          NOTES="Rolling nightly build from main.
          Commit: ${GITHUB_SHA}
          Built at (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit nightly --title "nightly" --notes "$NOTES" --target "${GITHUB_SHA}" --repo "$GITHUB_REPOSITORY"
          else
            gh release create nightly --title "nightly" --notes "$NOTES" --target "${GITHUB_SHA}" --repo "$GITHUB_REPOSITORY"
          fi
          # 同步 tag 到本次 SHA：只 edit 不移 tag 时，Source code 包永远停在创建提交。
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" -f sha="${GITHUB_SHA}" -F force=true --silent
          for f in $(find artifacts -name '*.tar.gz' | sort); do
            gh release upload nightly "$f" --clobber --repo "$GITHUB_REPOSITORY"
          done
          gh release upload nightly SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          echo "== 滚动 nightly 已更新 ✓（commit ${GITHUB_SHA}，$n_archives 个平台归档）=="
