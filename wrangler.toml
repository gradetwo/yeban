# 夜半官网 (yeban.wangda.today) —— Cloudflare Workers 静态资源配置
#
# 部署: `npx wrangler deploy`（CI 里由 .github/workflows/site-deploy.yml 自动执行）
# 本地校验: `npx wrangler deploy --dry-run`（不需要账号凭据）
# 本地预览: `npx wrangler dev` 或任意静态服务器指向 ./public
#
# 需要管理员配置的部分（都已注释，取消注释并填值即可）:
#   1) account_id —— 也可以用环境变量 CLOUDFLARE_ACCOUNT_ID（CI 走 secret）
#   2) 自定义域 yeban.wangda.today —— 取消下面 [[routes]] 的注释
#
# 站点是**纯静态**的：没有 Worker 脚本、没有构建步骤。
# Cloudflare 直接把这个 assets 目录作为 Worker 的静态资源发布。

name = "yeban-wangda-today"
compatibility_date = "2026-10-05"

# 发布到 <name>.<subdomain>.workers.dev（自定义域未配置时的兜底入口）
workers_dev = true

[assets]
directory = "./public"
# 未命中的路径返回 /404.html（并保留 404 状态码）
not_found_handling = "404-page"
# 目录式 URL 归一化: /foo/ 与 /foo/index.html 互相解析
html_handling = "auto-trailing-slash"

# account_id = "在这里填 Cloudflare account id（或改用 CLOUDFLARE_ACCOUNT_ID 环境变量）"

# 自定义域: 在 Cloudflare 控制台把 yeban.wangda.today 接入后取消注释
# [[routes]]
# pattern = "yeban.wangda.today"
# custom_domain = true
