[package]
name = "yeban-tui"
description = "夜半终端界面 (ratatui + crossterm): 与 GUI 共用 yeban-app 的引擎宿主、工程读写与快捷键策略表, 只换呈现层"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "yeban_tui"
path = "src/lib.rs"

[[bin]]
name = "yeban-tui"
path = "src/main.rs"

[dependencies]
# 路线甲 (见 src/lib.rs 的接缝说明): 依赖 yeban-app 库, 只调用其无 Slint 窗口的部件
# (engine_host / open / save / render_core / export_wav / cli::shortcut_rows /
# input::InputContext)。Slint 被链接但从不初始化。
yeban-app = { workspace = true }
# 保存前与 `yeban_save_project` 共用同一份触发样本收集（T-FIX-160）：
# `embed_samples::collect` 是保存侧内嵌口径的唯一实现，TUI 不另写一份。
# 该依赖已是 `yeban-app` 默认 `in-process-mcp` 路径里的成员；这里显式声明
# 只是为了在 TUI 源码里直接调用，不新增第三方包。
yeban-mcp = { workspace = true }
yeban-model = { workspace = true }
yeban-engine = { workspace = true }
# 鼓机生成（T-FIX-82①）：风格预置与生成层与 GUI/MCP 同一份 `yeban-theory`；
# 批次配方仍走 `yeban_app::bridge::drum_gen_ops`（这里只取预置/参数类型）。
yeban-theory = { workspace = true }
# 诊断包导出（T-FIX-82③）：与 GUI/MCP 同一个采集器 `yeban_diagnostics`。
yeban-diagnostics = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
unicode-width = { workspace = true }

[lints]
workspace = true
