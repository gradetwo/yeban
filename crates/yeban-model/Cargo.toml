[package]
name = "yeban-model"
description = "夜半 (Yeban) 权威工程数据模型: 960 PPQ 整数时钟、EntityId、BTreeMap 确定性 AST、Ops Log 与 Commit DAG"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "yeban_model"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ulid.workspace = true
# 谱面特征提取（`song_overview`）返回 dsp 分析线的输入契约
# （`yeban_dsp::song_overview::ScoreInput`）：同一份类型、同一份约定，
# 不在模型里发明第二套输入类型。`yeban-dsp` 不依赖本 crate ⇒ 无环；
# 本 crate 仍零 GUI 依赖（dsp 是纯数学 crate）。
yeban-dsp.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
