[package]
name = "yeban-render"
description = "Rayon 多核并行离线母带渲染与 RF64/MIDI 导出"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "yeban_render"
path = "src/lib.rs"

[features]
# 实验性 Ableton Live Set (`.als`) 导出 [ARCH-FMT-002] [ROAD-M4-007]。
#
# **默认关**：AGENTS.md §2 红线 6 与 `scripts/guards/policy_check.py` 的
# `FORBIDDEN_DEFAULT_FEATURES` 都点名了这个特性 —— 官方默认 release 构建里
# 不得默认开启它。因此 `default` 保持为空，该模块只在显式
# `--features experimental-als-export` 下才存在（默认构建既不编译它，也不链接 `flate2`）。
experimental-als-export = ["dep:flate2"]

# 实验性 Logic Pro (`.logicx`) bundle 导出 [ARCH-FMT-002] [ROAD-M4-007]。
#
# **默认关**（AGENTS.md §2 红线 6，与 `experimental-als-export` 同款）：
# `default` 保持为空，本模块只在显式 `--features experimental-logic-export` 下才存在。
# ⚠ 与 `.als` 不同，本 feature **没有可选依赖** —— `ProjectData` 是自研分块二进制，
# `MetaData.plist` 的 bplist00 编码器也是本 crate 自研的（见模块头的"为什么不用 plist crate"）。
# 因此默认构建与带本 feature 的构建，**依赖图逐包相同**（`cargo tree -p yeban-app -e normal --locked`）。
experimental-logic-export = []

[dependencies]
# SMF 编解码（下移出的独立 crate; 本行只为保持 `yeban_render::midi::*` 可用）。
yeban-midi = { path = "../yeban-midi" }
# 路由图与 EntityId 的唯一事实源 [MODEL-AST-001/004]。渲染层不复制数据模型。
yeban-model.workspace = true
# 共用纯数学 DSP 原语: 确定性 xorshift RNG 与标量块混音 [ARCH-RT-001] [ARCH-DET-001]。
# 版本由根清单钉死; 本 crate 不改变它的版本, 只把 feature 显式说清。
yeban-dsp.workspace = true
# L1 确定性要求"统一启用纯 Rust libm"、禁止平台 libm [ARCH-DET-001]:
# 分贝→线性增益等超越函数一律走 libm, 结果与宿主 libm 实现无关。
libm.workspace = true
# 输出缓冲的 SHA-256 位级摘要 (MUST-GATE-002 的 L1 bit-exact 判据需要可比较的哈希)。
sha2.workspace = true
# 离线渲染的并行工作窃取 [ROAD-M4-004]。
rayon.workspace = true
# SMF 0/1 导出 [ARCH-FMT-001 §5.5]。根清单用 default-features = false 登记 midly,
# 而 Smf::write_std 属于 midly 的 `std` feature, 因此这里必须显式打开它
# (实测见 docs/ledger/render-master-notes.md §3)。
midly = { workspace = true, features = ["std"] }
# 普通 RIFF WAV 的读写。RF64/BW64 的 ds64/bext 由本 crate 自研 (见 src/rf64.rs),
# hound 在这里同时充当"独立第三方读取器"来交叉验证自研写入器的字节布局。
hound.workspace = true
# 实验性 `.als` 导出的 Gzip 压缩 [ARCH-FMT-002] [ROAD-M4-007]。**可选依赖**,
# 只由 `experimental-als-export` 打开 (红线 6)。
#
# 根清单登记的是 `default-features = false`（flate2 的默认后端会拉 `runtime_detection`），
# 因此这里必须**显式**打开纯 Rust 后端 `rust_backend`（→ `miniz_oxide`）：
# C 版 zlib 会引入 `cc`/系统库，让"纯 Rust、无系统库"的构建前提失守。
flate2 = { workspace = true, optional = true, features = ["rust_backend"] }

[dev-dependencies]
# 属性测试 (ARCH-DET-002 的"任意线程数 → 逐位相同")。
proptest.workspace = true
# 文件往返测试需要真实临时文件。
tempfile.workspace = true

[lints]
workspace = true
