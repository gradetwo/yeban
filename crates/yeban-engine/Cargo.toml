[package]
name = "yeban-engine"
description = "cpal 声卡直驱、无锁 SPSC 调度、内部 PDC 与快照退役回收"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "yeban_engine"
path = "src/lib.rs"

# 设备 I/O 与 PDC 算法必须能被分开消费 [docs/adr/ADR-0001 D19]:
#   - `graph`(PDC 拓扑排序 + 关键路径 + 环形延迟线) **不得**引用 cpal,
#     因此 `yeban-render` 可以 `default-features = false` 依赖本 crate,
#     拿到同一份算法而不被拖入整条声卡驱动栈;
#   - 真实设备路径(device/rt 的 cpal 部分) 由 `device` feature 承载, 默认开启。
[features]
default = ["device"]
# 打开 cpal 声卡宿主 (`src/device.rs` 与 `src/rt.rs` 里的设备相关部分)。
device = ["dep:cpal"]

[dependencies]
# 版本全部来自根 [workspace.dependencies] 的登记, 本 crate **不**自带版本号, 也不需要 hoist。
#
# cpal / rtrb 是本 crate 的"重依赖": 本机 (M2) 不编译, 一律交给 CI。
# 注意: scripts/gates/run-gates.sh 的重依赖正则只认 `cpal = ...` 这种字面形式,
# 认不出 `cpal = { workspace = true, ... }` —— 因此**不要**在本机跑
# `run-gates.sh crate yeban-engine` (它不会被自动跳过)。
# 见 docs/ledger/engine-rt-notes.md §5「门禁缺口 1」。
cpal = { workspace = true, optional = true }
rtrb.workspace = true
thiserror.workspace = true
# 路由与轨道参数的唯一权威事实源 (RoutingGraph / TrackV3 / YebanProjectV1 /
# DeviceDefinition::latency_samples) [MODEL-AST-004, ARCH-PDC-001]。
#
# 这里可以直接写 `workspace = true`（继承出来是 `*`）是因为集成者已按 ADR-0001 D21
# 在 `deny.toml` 里放行了"带 path 的通配版本"(`allow-wildcard-paths = true`)。
# 在此之前（D21 落地前），本 crate 作为第一个跨成员依赖被迫写过显式 `version = "0.0.1"`。
yeban-model.workspace = true

[lints]
workspace = true
