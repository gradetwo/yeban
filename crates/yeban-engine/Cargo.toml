[package]
name = "yeban-engine"
description = "cpal 声卡直驱、无锁 SPSC 调度、内部 PDC 与快照退役回收"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "yeban_engine"
path = "src/lib.rs"

[dependencies]
# 全部来自根 [workspace.dependencies] 的登记版本, 本 crate **不**自带版本号,
# 也**不**需要 hoist (见 docs/ledger/engine-rt-notes.md §1)。
#
# cpal / rtrb 是本 crate 的"重依赖": 本机 (M2) 不编译, 一律交给 CI。
# 注意: scripts/gates/run-gates.sh 的重依赖正则只认 `cpal = ...` 这种字面形式,
# 认不出 `cpal.workspace = true` —— 因此**不要**在本机跑
# `run-gates.sh crate yeban-engine` (它不会被自动跳过)。
# 见 docs/ledger/engine-rt-notes.md §5「门禁缺口」。
cpal.workspace = true
rtrb.workspace = true
thiserror.workspace = true
# 路由与轨道参数的唯一权威事实源 (RoutingGraph / TrackV3 / YebanProjectV1) [MODEL-AST-004]。
#
# 注意这里**不是** `yeban-model.workspace = true` —— 原因是机械的, 不是偏好:
#   根 `[workspace.dependencies]` 把内部 crate 登记为**纯 path**(`yeban-model = { path = ... }`,
#   没有 `version`), Cargo 因此给成员依赖解析出 `req = "*"`;
#   而 `deny.toml` 的 `[bans] wildcards = "deny"` 会把 `*` 判为 MUST-GATE-004 失败。
#   本 crate 是**第一个**跨成员依赖的工作线, 所以这个冲突第一次暴露。
# 处置: 按工作线纪律"根里没有的依赖 → 在自己 crate 写显式版本 + 记 TODO(hoist)",
#       这里写显式版本; **集成者**只需在根里给内部 crate 补上 `version = "0.0.1"`,
#       本行即可还原为 `yeban-model.workspace = true`。
# TODO(hoist): 根 `[workspace.dependencies]` 的 `yeban-model` 补 `version = "0.0.1"`。
# 详见 docs/ledger/engine-rt-notes.md §1 与 §4 needs 清单。
yeban-model = { path = "../yeban-model", version = "0.0.1" }

[lints]
workspace = true
