[package]
name = "yeban-engine"
description = "cpal 声卡直驱、无锁 SPSC 调度、内部 PDC 与快照退役回收"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "yeban_engine"
path = "src/lib.rs"

# 设备 I/O 与 PDC 算法必须能被分开消费 [docs/adr/ADR-0001 D19]:
#   - `graph`(PDC 拓扑排序 + 关键路径 + 环形延迟线) **不得**引用 cpal,
#     因此 `yeban-render` 可以 `default-features = false` 依赖本 crate,
#     拿到同一份算法而不被拖入整条声卡驱动栈;
#   - 真实设备路径(device/rt 的 cpal 部分) 由 `device` feature 承载, 默认开启。
[features]
default = ["device"]
# 打开 cpal 声卡宿主 (`src/device.rs` 与 `src/rt.rs` 里的设备相关部分)。
device = ["dep:cpal"]

[dependencies]
# [D56 诊断包] 两者都是根清单**早已预留**的依赖（零新增）。
zip.workspace = true
sha2.workspace = true
# 版本全部来自根 [workspace.dependencies] 的登记, 本 crate **不**自带版本号, 也不需要 hoist。
#
# cpal / rtrb 是本 crate 的"重依赖": 本机 (M2) 不编译, 一律交给 CI。
# 注意: scripts/gates/run-gates.sh 的重依赖正则只认 `cpal = ...` 这种字面形式,
# 认不出 `cpal = { workspace = true, ... }` —— 因此**不要**在本机跑
# `run-gates.sh crate yeban-engine` (它不会被自动跳过)。
# 见 docs/ledger/engine-rt-notes.md §5「门禁缺口 1」。
cpal = { workspace = true, optional = true }
rtrb.workspace = true
thiserror.workspace = true
# 电平口径（峰值/峰值保持/RMS/平滑 RMS/dBFS/钳位/取最新 + 4× 真峰值）的**唯一实现**。
# 它从本 crate 的 `src/level.rs` 上移到 `yeban-dsp`（纯数学、零重依赖），engine 只做
# `pub use` 再导出，绝不保留第二份实现 [ARCH-UI-002, ROAD-M2-008]。依赖形态写
# `workspace = true`（继承出来是 `*` + path），由 ADR-0001 D21 的
# `allow-wildcard-paths = true` 放行 —— 与下面的 `yeban-model` 同一条裁决。
yeban-dsp.workspace = true
# 路由与轨道参数的唯一权威事实源 (RoutingGraph / TrackV3 / YebanProjectV1 /
# DeviceDefinition::latency_samples) [MODEL-AST-004, ARCH-PDC-001]。
#
# 这里可以直接写 `workspace = true`（继承出来是 `*`）是因为集成者已按 ADR-0001 D21
# 在 `deny.toml` 里放行了"带 path 的通配版本"(`allow-wildcard-paths = true`)。
# 在此之前（D21 落地前），本 crate 作为第一个跨成员依赖被迫写过显式 `version = "0.0.1"`。
yeban-model.workspace = true

[lints]
workspace = true

# `[MUST-GATE-001]` 的运行期断言需要**计数型全局分配器**，而它是进程全局的
# ⇒ 关掉 libtest 才能让数字无歧义（libtest 自己会在别的线程里分配，第一版实测因此假红 9 次）。
# `cargo test --all-targets` 仍会构建并运行它，以退出码判定。
[[test]]
name = "rt_zero_alloc"
harness = false

# 电平线的运行期判据（[ARCH-UI-002]/[ROAD-M2-008]）：同一个计数型分配器，
# 但跑的是"带**真实电平计算**的量子"（每轨 + 母线 / 每量子一次批量发布 / UI 取最新 /
# 队列溢出可观测）。同样必须 `harness = false`（理由见 `rt_zero_alloc.rs` 的模块文档与教训 L22）。
[[test]]
name = "meter_rt_contract"
harness = false

# 合成路径（[ROAD-M2-005]/[ROAD-M2-006]）接入之后的**同一个**运行期断言：
# 音符铺满整个测量窗口（256 个交叠音符 ⇒ 10,000 个量子全程有声部在跑），
# 并**同时**自检"窗口里真的在出声"（防"什么都没跑"的假绿）。同样 `harness = false`。
[[test]]
name = "synth_rt_zero_alloc"
harness = false

# 走带（`line/transport-engine`）接入之后的**同一个**运行期断言：窗口里跑的是
# "命令经无锁 SPSC 出队 → 量子边界应用 → 整数有理数推进 → 原子镜面发布"
# （外加停住时的静音分支与 seek 的声部释放）。同样 `harness = false`（理由同上）。
[[test]]
name = "transport_rt_zero_alloc"
harness = false

# [MUST-GATE-012] 的**高频交换压测**：≥ 50 000 次快照交换（5 轮 × 10 000）+ 尾段积压。
# 与上面几个目标的关键差别：这里的音频线程是真的**另一个 OS 线程**，
# 因此分配计数器**按线程**武装、快照析构**按线程**归账（`snapshot::release_probe`），
# 并做"创建数 == 释放数 + 存活数"的零泄漏对账。
# 仍然 `harness = false`（同一个理由：计数型全局分配器是进程全局的，libtest 自己会在
# 别的线程里分配/释放 ⇒ 窗口数字会被判据自己污染 —— 教训 L22）。
[[test]]
name = "snapshot_retire_churn"
harness = false
