[package]
name = "yeban-midi-io"
description = "物理 MIDI 输入接入（`midir` 宿主 + 预分配无锁事件环 + 960 PPQ 时间戳换算）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "yeban_midi_io"
path = "src/lib.rs"

[features]
# ⭐ 依 ADR-0006 D5 与人类裁决（2026-10-11）：feature 名 = `midi-input`，**默认关**
# ⇒ `default` **不含**它 ⇒ release 默认构建不启用（与红线 6 的 `mcp-http`/`ui-mcp`/
# `asio`/`experimental-*` 同族处理）。
default = []
midi-input = ["dep:midir"]

[dependencies]
# ⭐ ADR-0006 D1/D6：版本**钉死** `0.11.1`（写进根 `[workspace.dependencies]`）；许可证 MIT
# ⇒ 已在 `deny.toml` 的 `allow` 内。⛔ **不开** `jack` feature（D6：会让 `jack-sys` 进树）。
# 平台后端跟随 midir 默认：macOS `coremidi` / Linux `alsa` / Windows `windows`+`parking_lot`。
midir = { workspace = true, optional = true }

# ⭐ ADR-0006 D3：MIDI 回调（OS 线程）**按红线 7 对待** ⇒ 只把**定长事件**写进
# **构造期预分配**的无锁 SPSC 环。⚠ 环**建在 `rtrb` 上**（⭐ `ring.rs::event_channel` /
# `record.rs::record_channel` **也是**建在它上面 ⇒ ⭐ **同一套语义、⭐ 同一条依赖**），
# ⭐ ⛔ **刻意**不依赖 `yeban-engine`** —— 那会把 `cpal`／声卡后端拖进本 crate，
#     也会触犯依赖方向守卫。⭐ 语义照抄：**整事件原子**（⛔ 不暴露半条事件）、
#     环满 ⇒ **按事件计数丢弃、⭐ ⛔ 永不阻塞**、⭐ 推送路径 **⛔ 零分配／零锁**。
rtrb = { workspace = true }

[lints]
workspace = true
