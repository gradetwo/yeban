[package]
name = "yeban-dsp"
description = "纯数学 DSP 库: 真峰值限制器、总线压缩、通道条、808/909 鼓机与复音合成"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "yeban_dsp"
path = "src/lib.rs"

[dependencies]
# [ARCH-DSP-004 / HD-44=A] 弹性拉伸（C++ 实现 + Rust 包装）。
# `unsafe` 落在依赖内部，本 crate 的 `#![forbid(unsafe_code)]` 仍成立。
signalsmith-stretch.workspace = true
# L1 确定性要求"统一启用纯 Rust libm"、禁止平台 libm [ARCH-DET-001]:
# ADSR 的一极点系数等超越函数一律走 libm, 结果与宿主 libm 实现无关。
libm.workspace = true
# 整曲总览图 STFT：4096 点实数 FFT（song_overview.rs）。realfft 后端 rustfft
# 为纯 Rust 确定性实现；只替换 math::fft 调用，数值须与旧实现逐位一致（测试钉死）。
realfft.workspace = true
# 整曲总览图并行（song_overview.rs，follow-ons (c)）：帧级 STFT / 逐轨频段
# 能量 / 逐拍特征三处 rayon 并行；归约恒保原序，结果逐位一致。rayon 是
# workspace 既有依赖（yeban-render 在用，MIT / Apache-2.0），不新增许可面。
rayon.workspace = true

[lints]
workspace = true
