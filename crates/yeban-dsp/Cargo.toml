[package]
name = "yeban-dsp"
description = "纯数学 DSP 库: 真峰值限制器、总线压缩、通道条、808/909 鼓机与复音合成"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "yeban_dsp"
path = "src/lib.rs"

[dependencies]
# [ARCH-DSP-004 / HD-44=A] 弹性拉伸（C++ 实现 + Rust 包装）。
# `unsafe` 落在依赖内部，本 crate 的 `#![forbid(unsafe_code)]` 仍成立。
signalsmith-stretch.workspace = true
# L1 确定性要求"统一启用纯 Rust libm"、禁止平台 libm [ARCH-DET-001]:
# ADSR 的一极点系数等超越函数一律走 libm, 结果与宿主 libm 实现无关。
libm.workspace = true

[lints]
workspace = true
