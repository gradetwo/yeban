[package]
name = "yeban-mcp"
description = "Yeban Intent API v2: 领域 MCP 服务 (库 + 独立 stdio 二进制双形态)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "yeban_mcp"
path = "src/lib.rs"

[[bin]]
name = "yeban-mcp"
path = "src/bin/yeban-mcp.rs"

[features]
# 红线 [AGENTS.md §2 红线 6 / MUST-GATE-009]: `mcp-http` **绝不**进 default。
# 默认构建里不会链接任何网络监听代码; 要开必须显式 `--features mcp-http`,
# 并且运行时**再**给一次 `--enable-mcp-http` —— 两道开关, 见 src/transport/mod.rs。
default = []
# Streamable HTTP JSON-RPC 传输 (形态 A: 内嵌于 yeban-app)。零新增依赖:
# std::net::TcpListener + 线程手写最小 HTTP/1.1。
mcp-http = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# 领域实现的**执行引擎**: `Op`(23 变体 + 自包含逆操作)、`CommitGraph`、
# `YebanProjectV1::validate()`、`AssetHash::of_bytes`(SHA-256 摘要)。
# 十个 Intent 工具不复制一份数据模型, 也不自己写第二套逆操作
# (见 src/domain/mod.rs 的"逆操作的唯一来源"一节)。
#
# 依赖方向: yeban-mcp -> yeban-model。yeban-model 是纯数据模型 (零 GUI、零系统库)。
yeban-model.workspace = true
# 乐理与流派规则引擎 (`yeban-theory`)。`yeban_propose_section` 的**风格标识**与
# **音阶语义**按需消费它 (`ADR-0001` **D49**, 关闭
# `docs/ledger/tools-domain-notes.md` 的 needs-6)：
#
# - 风格预设的**合法集合** = `GenreLibrary::ids()`(182 条流派规则)；未知风格仍由
#   `GenreLibrary::get` 判成 `TheoryError::GenreNotFound` ⇒ 契约码 `STYLE_NOT_FOUND`
#   的错误语义**没有**放松(判据钉住)；
# - 调式**语义** = `ScaleKind` / `Scale` 的音级集合，不再是本地 12 行常量表；
# - 派生的**声部数** = 该流派典型走向里"和弦构成音数"的最大值
#   (`GenreRule` + `Progression` + `Chord::pitch_classes`)。
#
# 本线**不复制** theory 的任何逻辑 (D49 明文)：这里只调用它的公开 API。
# 依赖方向: yeban-mcp -> yeban-theory。`yeban-theory` 刻意只依赖 `thiserror` + `libm`
# 两个轻量库 (见它自己的 `Cargo.toml` 注释 / [ARCH-TOP-003])，因此**不改变**
# "`src/domain/section_build.rs` 是零重依赖模块、本机可用裸 `rustc --test` 真跑"的性质
# (实测: `cargo-local.sh build -p yeban-theory` 4 秒; 脚手架 **32 passed; 0 failed**, 见
# `docs/ledger/theory-wiring-notes.md` §5)。
#
# 版本仍由根清单 `[workspace.dependencies]` 唯一决定 —— 本线**没有**改根清单的行,
# 也没有新增任何第三方包 (`Cargo.lock` 只多一条成员间的依赖边)。
yeban-theory.workspace = true
# 离线母带渲染器 (Rayon 多核调度 + RF64/BW64 + TPDF 抖动写入器)。
# `yeban_render_master` 的渲染本体不再返回 -32005, 而是真的调用它。版本仍由根清单
# 唯一决定, 本线**未改**根 `Cargo.toml`, 也未引入任何新的第三方包。
#
# 代价 (如实登记): 这条依赖边让本 crate 传递性地依赖 rayon / hound / midly,
# 因此 `run-gates.sh crate yeban-mcp` 在本机跑的会是重依赖编译 —— 处置见
# `docs/ledger/mcp-render-notes.md` §6「本机真跑 vs CI」。
yeban-render.workspace = true
# 离线解码与高精重采样 (symphonia / rubato, 见 `line/decode-core` 的台账)。
# `yeban_render_master` 现在**真的消费** `ClipContent::Audio` 的 CAS 资产字节:
# 解码 → 编码器延迟裁剪 → 采样率不一致时 rubato sinc 重采样 → AudioClipSource。
#
# 边界 [ARCH-TOP-002] / [ARCH-RT-001]: 解码是**离线**路径 (可分配、可阻塞),
# 且**只**发生在 `render::build` 里 (每个资产一次), 绝不出现在
# `AudioSource::render_block` 的逐块回调里 —— 后者会被 Rayon 工作线程反复调用。
#
# 这条边复用根 `[workspace.dependencies]` 里**已登记**的 `yeban-decode`,
# 因此 `Cargo.lock` 的包集合不变 (没有新的第三方包), 只有一条成员间的依赖边新增。
yeban-decode.workspace = true
# 母带合成里的超越函数 (正弦振荡器 / 等程律频率 / 等功率声相) [ARCH-DET-001]:
# 规范要求"统一启用纯 Rust libm", 禁止落到宿主 libm —— 否则同一工程的母带会随平台差 LSB。
libm.workspace = true

[lints]
workspace = true
