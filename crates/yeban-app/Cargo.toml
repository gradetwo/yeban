[package]
name = "yeban-app"
description = "Slint GUI 主程序与桌面窗口宿主 (内嵌 MCP 服务)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "yeban_app"
path = "src/lib.rs"

[[bin]]
name = "yeban-app"
path = "src/main.rs"

[dependencies]
yeban-midi = { path = "../yeban-midi" }
# 版本唯一事实源仍是根 Cargo.toml 的 [workspace.dependencies] (ADR-0001 D5) —— 本文件不写版本号。
# 根里 slint 被钉成 `default-features = false`, 因此**必要 feature 必须在成员这一层显式列出**。
# 核验来源 (2026-10-05, docs.rs):
#   slint 1.18.1 feature 表  https://docs.rs/crate/slint/1.18.1/features
#     - std / compat-1-2 / accessibility / renderer-femtovg / renderer-software 都在默认集里,
#       但 default-features = false 会把它们全部关掉, 所以这里逐个补回;
#     - backend-default 是"选后端"的开关, 转发到 i-slint-backend-selector/default。
#   转发链  https://docs.rs/crate/i-slint-backend-selector/1.18.1/features
#     i-slint-backend-selector/default -> backend-winit -> backend-winit-wayland + backend-winit-x11
#   因此不需要再手写 backend-winit / backend-winit-x11 / backend-winit-wayland。
# 注意: 不启用 renderer-skia —— 规范 §12.1 提到的 Skia 软件后端会拖入 LLVM/clang,
#       与"本机不跑高耗 CPU 任务"的纪律冲突; 可移植的 renderer-software 已足够做无头兜底。
slint = { workspace = true, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-default",
    "renderer-femtovg",
    "renderer-software",
] }

# 界面**不再渲染硬编码的演示数据** —— 它由 `YebanProjectV1` 经 `src/bridge.rs` 的投影层驱动
# (见 docs/ledger/app-binding-notes.md)。因此 app 需要权威数据模型 crate。
# 依赖方向: 架构规范 §8 的 crate 清单 = yeban-app --> yeban-model (与 slint 一样单向)。
# 只写 `{ workspace = true }`, **不写 version** —— 根 `[workspace.dependencies]` 是版本唯一
# 事实源 (ADR-0001 D5); 成员间 path 依赖的通配豁免见 ADR-0001 **D21**。
# 红线 3 不受影响: 它约束的是**引擎层** crate 不得引入 GUI; 反向 (GUI 依赖模型) 正是规范要求的形态。
yeban-model = { workspace = true }
# SFZ 乐器装载（`SfzInstrument::load` 需要 `yeban_sfz::parser::ParseLimits`，而引擎**没有**把它
# re-export ⇒ 从 app 侧够不着）⇒ 加一条**工作区内部**依赖边。⛔ 不是新的外部 crate
# （`Cargo.lock` 里本来就有 `yeban-sfz`）⇒ `cargo deny` 的许可面不变；依赖图变了 ⇒ 按纪律
# 重生成 `docs/ledger/dependency-licenses.md` 并一起提交。
yeban-sfz = { workspace = true }

# ---------------------------------------------------------------------------
# yeban-render: SMF (MIDI) 导出的**唯一**编码器, app-export-midi 工作线
# ---------------------------------------------------------------------------
# 为什么 app 需要它: ADR-0001 **D47** 的裁决是"MIDI 导出的唯一出口 = app CLI
# `--export-midi`"(不扩 `yeban_render_master` 的 format 参数)。而 SMF 的编码器只有一份
# ——`crates/yeban-render/src/midi.rs`(含 `midly` 编码 + 自研 VLQ/chunk 字节级核对)。
# 因此 app 侧**只**做"工程 → `MidiExport`"的映射(`src/export_midi.rs`), 字节由那一个
# 编码器产出; 在这里再写一份编码器是明令禁止的。
#
# 这是一条**工作区内**依赖边(D51): 没有引入任何新的外部 crate —— `yeban-render` 早已
# 是 workspace 成员, 它的 `midly`/`rayon`/`hound` 早已在 `Cargo.lock` 里。它给
# `Cargo.lock` 带来的变化只有 `yeban-app` 依赖列表里的一行(由 `cargo metadata` 机械生成,
# 见 docs/ledger/app-export-midi-notes.md §6 的原始 diff)。
# 只写 `{ workspace = true }`, 不写 version(ADR-0001 D5/D21)。
yeban-render = { workspace = true }

# ---------------------------------------------------------------------------
# yeban-decode: SFZ 样本的**通用解码入口** (symphonia / rubato), 任务单 #85
# ---------------------------------------------------------------------------
# 为什么 app 需要它: SFZ v2 音色库里的样本**不只是 PCM WAV** —— FLAC / OGG 是常见形态
# (规范 `ROAD-M-1-004` 点名 "标准 PCM WAV/FLAC")。`read_plain_wav_mono_f32` 只能读
# PCM/float WAV, 因此非 WAV 样本过去一律落"格式不受支持"(`#83` 的乙口径读数)。
# 本仓**已有**能解 FLAC/OGG 的唯一入口 —— `yeban-decode` 的 `decode_path`
# (symphonia 显式启用 wav/ogg/flac/vorbis) ⇒ 接线**只**加这一条依赖边,
# ⛔ 本 crate 不复制第二份解码器, 也不引入任何新的第三方包。
#
# 这是**工作区内部**依赖边 (ADR-0001 D21 的 `allow-wildcard-paths` 豁免):
# `yeban-decode` 早已是 workspace 成员, 它的 `symphonia`/`rubato` 早已在 `Cargo.lock` 里
# (由 `yeban-mcp` 那条边带进来) ⇒ `-e normal` 依赖图新增的**包**只有 `yeban-decode`
# 自己; `Cargo.lock` 的变化只有 `yeban-app` 包条目里的一行依赖名。
# 依赖图变了 ⇒ 按纪律重生成 `docs/ledger/dependency-licenses.md` 并一起提交。
#
# 口径差 (⚠ **必须显式折单声道**): `DecodedAsset::samples()` 是**交织**多声道, 而
# `read_plain_wav_mono_f32` 的既有口径是按 `step_by(channels)` 取**声道 0** ⇒
# 接线时按同一口径折单声道, ⛔ 不把交织数据当单声道用 (见 `src/sfz_load.rs` 的分派函数)。
#
# 只写 `{ workspace = true }`, 不写 version (ADR-0001 D5)。
yeban-decode = { workspace = true }

# ---------------------------------------------------------------------------
# yeban-engine: 实时引擎的**只读消费面** (电平 SPSC + 快照), app-mixer 工作线
# ---------------------------------------------------------------------------
# 为什么 app 需要它: `[ARCH-UI-002]` 要求"实时线程以 60Hz 向无锁 Meter SPSC 压入真峰值
# 与 RMS, UI 线程定时器批量出队更新 Slint Properties"。生产侧 (`MeterBank` /
# `MeterCollector::drain_latest` / `MeterBoard` / `supersedes`) 已在 `yeban-engine` 落地
# (见 docs/ledger/engine-meters-notes.md), **消费者**只能是持有 UI 线程的那一侧 ——
# 也就是本 crate。app 侧**不另造队列**: `meter_channel()` 建的 SPSC 由引擎提供,
# UI 只持消费端 (`src/meters.rs`)。
#
# 为什么用**默认 feature** (ADR-0001 D19): 本 crate 未来要宿主声卡 (cpal),
# 而 D19 的裁决是"引擎把设备 I/O 用 feature 隔开, 需要设备的消费者用默认 feature"。
# **不在 app 里引 cpal 的裸类型**: `src/engine_host.rs` 只用 `EngineSnapshot` /
# `EngineRuntime` / `meter_channel` 这些与设备无关的公开面, 一个 `cpal::*` 都不出现
# (D19 的字面要求)。离线渲染器 `yeban-render` 走的是另一条路
# (`default-features = false`), 与本条无关。
yeban-engine = { workspace = true }
# [D56] 诊断包: UI 与 MCP 调**同一个** `export_diagnostics`。
yeban-diagnostics = { path = "../yeban-diagnostics" }

# ---------------------------------------------------------------------------
# serde_json: **只**为 `#[path]` 共享进来的 `.yeban.lock` 实现 (零新增包)
# ---------------------------------------------------------------------------
# `ROAD-M4-008` 选项 (a) 第三片：GUI 的保存路径必须与领域 MCP 参与**同一把**
# `.yeban.lock`，而锁的**唯一实现**在 `crates/yeban-mcp/src/domain/lock.rs`。
# 本 crate 用 `#[path]` 把那一份源码装进 `src/project_lock.rs`（与
# `src/undo.rs` 装 `undo_session.rs` 同款）⇒ 不写第二份锁，也不新增 `yeban-mcp`
# 依赖边（MUST-GATE-009 的第一道开关因此**没有被削弱**：
# `cargo tree -p yeban-app -e normal --locked | grep -c yeban-mcp` 仍然是 0）。
#
# 代价只有一条**直接边**：那份源码的锁元数据（`ARCH-SEC-001` 第 4 条）用 `serde_json`。
# 这个包**早就在** `-e normal` 的依赖图里（`yeban-model` → `serde_json`），因此
# 默认依赖图的**包集合一个没变**（判据是零编译的 `cargo tree` 前后对账，见
# `docs/ledger/m4-008-authority-notes.md` §7）。它本来也只是 dev-dependency
# （`tests/in_process_mcp.rs` 要解析 JSON-RPC 响应）；dev 目标看得见普通依赖，
# 因此那一段不需要重复列出。
serde_json = { workspace = true }

# ---------------------------------------------------------------------------
# ui-test-port: 无头 UI 自动化测试端口 (默认**关闭**)
# ---------------------------------------------------------------------------
# 依赖方向 (架构规范 §8 的 crate 清单): yeban-app --(feature)--> yeban-ui-test-port。
# 反向依赖会成环, 所以控件树的**数据模型**住在 test-port 侧, 适配器住在 app 侧
# (src/test_port_adapter.rs)。
#
# 为什么默认关闭: `AGENTS.md` §2 红线 6 的精神是"测试/内省能力不进默认构建"。
# 本 crate 的测试端口会把 Slint 的 Testing Backend (官方**内部** crate) 拉进依赖图,
# 而 release 二进制不需要它。因此它只能被显式 `--features ui-test-port` 打开。
# 只写 `path`(+`optional`), **不写 version** —— 成员清单里不出现版本号是本仓库的规则
# (ADR-0001 D5: 版本唯一事实源是根 `[workspace.dependencies]`)。
#
# 注意: Cargo 会给这种依赖隐式补一个 `*` 版本需求, 而 `deny.toml` 的
# `[bans] wildcards = "deny"` 默认会因此报 `error[wildcard]`(实测踩过: CI run 37221429630)。
# 这条现在由 ADR-0001 **D21** 的 `[bans] allow-wildcard-paths = true` 豁免 ——
# 该豁免只放行"带 path 的 `*`", registry 依赖仍必须写真实版本。需要真正发布本 crate 时,
# 再由集成者把它连同版本一起登记进根 `[workspace.dependencies]`。
# ADR-0006 D2/D5: 物理 MIDI 输入的宿主 crate。**可选** —— 只有在 `midi-input` feature 下
# 才进依赖树（`dep:` 语法, 不产生同名隐式 feature）⇒ 默认构建与 release 默认都不含它。
yeban-midi-io = { workspace = true, optional = true }
yeban-ui-test-port = { path = "../yeban-ui-test-port", optional = true }

# ---------------------------------------------------------------------------
# in-process-mcp: 形态 A 的**运行态挂载** —— app 进程内托管领域 MCP 的环回 HTTP 控制面
# ---------------------------------------------------------------------------
# 依赖方向: yeban-app --(feature)--> yeban-mcp。反向会成环, 因此**不允许**反向;
# `scripts/gates/check_mcp_dependency_direction.py` 约束的是 yeban-mcp **不得**依赖
# yeban-app (它自己的"轻量 crate"规则), 不禁止 app 依赖它。
#
# 为什么默认关闭 (AGENTS.md §2 红线 6 / MUST-GATE-009「网络监听默认关闭」):
# 编译期是**第一道**开关 —— 默认 release 二进制里既没有监听循环, 也没有 yeban-mcp
# 这一整个依赖图。核验命令 (零编译, 本机可跑):
#     cargo tree -p yeban-app -e normal --locked                      # 默认档: `yeban-mcp` 命中 **0**
#     cargo tree -p yeban-app -e normal --locked --features in-process-mcp   # 命中 **>= 1**
#
# `yeban-mcp/mcp-http` 必须**一起**打开: 那个 crate 的 `transport::http` 模块在非 test
# 构建下只在 `mcp-http` feature 下存在, 少了它连 `HttpServer::bind_loopback` 都没有。
# 运行期还有**第二道**开关 (`--enable-mcp-http` / `YEBAN_MCP_HTTP=1`), 见
# `crates/yeban-app/src/mcp_mount.rs` 的模块文档 —— 编译进来了不等于要在生产里开。
#
# 只写 `path`(+`optional`), 不写 version: 成员清单里不出现版本号是本仓库的规则
# (ADR-0001 D5; 带 path 的 `*` 由 D21 的 `allow-wildcard-paths` 豁免, 与上面
# `yeban-ui-test-port` 同款)。
yeban-mcp = { path = "../yeban-mcp", optional = true }

# ---------------------------------------------------------------------------
# ui-mcp-http: **UI 控制面**（14 条 `ui/*` 方法）的环回入口
# ---------------------------------------------------------------------------
# 依赖方向: yeban-app --(feature)--> yeban-ui-mcp --> {yeban-mcp, yeban-ui-test-port}。
# **不反向**（yeban-ui-mcp 绝不依赖 yeban-app，否则成环）—— 因此"怎么拿像素"由
# `PortAdapter` 以函数指针注入（与 `[dev-dependencies]` 那一条下面的注释同款）。
#
# 为什么默认关闭 (AGENTS.md §2 红线 6 / MUST-GATE-009): 与 `in-process-mcp` 同一条纪律。
# 默认构建里既没有 UI 执行面 (`yeban-ui-test-port` 的 Tier-1 软件光栅化 + testing
# backend)，也没有 `yeban-mcp/mcp-http` 的报文层 —— 也就是说**一个监听循环都不在依赖图上**。
# 核验命令 (零编译):
#     cargo tree -p yeban-app -e normal --locked                         # 默认档: yeban-ui-mcp 命中 0
#     cargo tree -p yeban-app -e normal --locked --features ui-mcp-http   # 命中 >= 1
#
# `yeban-ui-mcp/ui-mcp-http` 必须**一起**打开: 那个 crate 的 `transport::http` /
# `transport::mount` 在非 test 构建下只在那个 feature 下存在，少了它连
# `UiHttpServer::bind_loopback` 都没有。运行期还有第二道开关
# (`--enable-ui-mcp-http`)，见 `src/ui_mcp_serve.rs`。
#
# 同一个包同时出现在 `[dependencies]`(optional) 与 `[dev-dependencies]` 是 Cargo
# 支持的写法（`yeban-ui-test-port` 已经是这个形状）: dev 段那一条给**测试目标**，
# optional 那一条给**产品路径**（非默认 feature 打开时）。
#
# 只写 `path`(+`optional`)，不写 version —— 见上面 `yeban-mcp` 的同一条注释。
yeban-ui-mcp = { path = "../yeban-ui-mcp", optional = true }

# ---------------------------------------------------------------------------
# rfd: **原生文件对话框**（任务单 `#86` 乙，⭐ 人类授权）
# ---------------------------------------------------------------------------
# 为什么需要它：今天"打开 / 保存工程、选 SFZ"只能靠 CLI 或混音台的**文本框**
# （勘察确认：全仓 `rfd` / `native-dialog` / `FileDialog` 命中 0）。用户没有
# 系统级的选择器可点。
#
# 为什么是 `rfd`（而不是 `native-dialog` / 自己写平台 FFI）：
#   * 本仓**已经**在依赖图里有它需要的全部 macOS 依赖 —— 实测 `-e normal` 的
#     `cargo tree` 只多 **1** 个包（`rfd` 自己），`Cargo.lock` 只多 **2** 条
#     （`rfd` ＋ `pollster`）：`objc2 0.6.4` / `objc2-app-kit 0.3.2` /
#     `objc2-foundation 0.3.2` / `block2 0.6.2` / `raw-window-handle` 早已被
#     slint/winit 带进来 ⇒ **没有引入新的 objc2 族**（这是本单事先担心的那一点）。
#     Linux 目标多 **4** 个包（`cargo tree --target x86_64-unknown-linux-gnu`）。
#   * 默认 feature 里**没有** `gtk3`（那会拖进整套 GTK）—— 起的是 `xdg-portal`
#     那条腿，⛔ 不需要在 CI 上装 GTK 开发库。
#   * 它是这条路上最常用的 crate（原生对话框、跨平台、MIT/Apache-2.0 双许可）。
#
# ⚠ 依赖图变了 ⇒ 按纪律重生成 `docs/ledger/dependency-licenses.md` 并**同批提交**。
#
# ⚠ **与 `#85` 的 `yeban-decode` 边同段**：`#85`（FLAC/OGG 接线）在它自己的树上加了
# `yeban-decode = { workspace = true }`。两条边都落在本 `[dependencies]` 段里，
# 合并时**不会重叠**（各自一块带注释的段落）⇒ 由集成者按序处理。
#
# 只写版本号字面量：它是 **registry** 依赖（⛔ 不是成员间 path 依赖），
# `deny.toml` 的 `[bans] wildcards = "deny"` 要求真实版本需求。
rfd = "0.17.2"

[features]
# `dep:` 语法: 只暴露 feature 名, 不额外产生一个同名隐式 feature。
ui-test-port = ["dep:yeban-ui-test-port"]

# `midi-input`: ⭐ **物理 MIDI 输入的产品入口**（`--midi-in <端口> [--midi-in-seconds N]`,
# 见 `src/midi_in.rs`）。⭐ 依 ADR-0006 **D5** 与人类裁决（2026-10-11）：feature 名 `midi-input`、
# ⭐ **默认关**（即 `default` 不含它）。⚠ 负责人同次指示："产品和模块全部完整后要改为**默认开**"
# ⇒ 那是**阶段性**的、⛔ 不是终态 ⇒ 届时把它移进 `default` 并**单独登记**。
# 它**转发**到 `yeban-midi-io/midi-input` —— 那边才是 `midir` 的实际宿主（FFI 面收在一处）。
midi-input = ["dep:yeban-midi-io", "yeban-midi-io/midi-input"]

# `in-process-mcp`: 形态 A 的运行态挂载 (见上面的长注释与 `src/mcp_mount.rs`)。
# **不在 `default` 里** —— 这是 MUST-GATE-009 的第一道开关, 不是可选的便利。
# 它同时打开 `yeban-mcp/mcp-http`: 那一边的监听代码同样默认关着。
in-process-mcp = ["dep:yeban-mcp", "yeban-mcp/mcp-http"]

# `ui-mcp-http`: **UI 控制面**的产品入口 (`--enable-ui-mcp-http`, 见 `src/ui_mcp_serve.rs`)。
# **不在 `default` 里** —— 同一条 MUST-GATE-009 的第一道开关。三个 `dep:` 由
# `yeban-ui-mcp` 的执行面推出: 光栅化 + testing backend 在 `yeban-ui-test-port`,
# 报文层与令牌在 `yeban-ui-mcp`(它再转发 `yeban-mcp/mcp-http`)。
ui-mcp-http = [
    "dep:yeban-ui-mcp",
    "dep:yeban-ui-test-port",
    "yeban-ui-mcp/ui-mcp-http",
]

# `experimental-als-export`: `--export-als` 的实验性 Ableton `.als` 导出
# (`[ARCH-FMT-002]` / `[ROAD-M4-007]`; ADR-0001 **D47** 把导出的唯一出口定为 app CLI)。
#
# **不在 `default` 里** —— AGENTS.md §2 红线 6 与 `scripts/guards/policy_check.py` 的
# `FORBIDDEN_DEFAULT_FEATURES` 都点名了这个特性。它只是把 `yeban-render` 那一边的
# 同名 feature 转发开: 真正的导出实现与可选的 `flate2` 依赖都住在 `yeban-render`,
# 本 crate **不**直接依赖 `flate2`, 也**不**在这里复制第二份 `.als` 编码器
# (与 `--export-midi` 只做薄封装、字节由 `yeban-render` 的 SMF 编码器产出同款)。
# 默认构建里这个开关是**一次点名 feature 的用法错误**(退出码 2), 绝不静默忽略 ——
# 与 `--enable-mcp-http` / `in-process-mcp` 同款(见 `src/cli.rs` 的 `ParseError::AlsNotCompiled`)。
experimental-als-export = ["yeban-render/experimental-als-export"]

# `experimental-logic-export`: 实验性 Logic Pro `.logicx` bundle 导出的转发开关
# (`[ARCH-FMT-002]` / `[ROAD-M4-007]`)。
#
# **不在 `default` 里** —— AGENTS.md §2 红线 6 与 `scripts/guards/policy_check.py` 的
# `FORBIDDEN_DEFAULT_FEATURES` 都点名了这个特性。它只把 `yeban-render` 那一边的同名
# feature 转发开: 真正的编码器住在 `yeban-render/src/logic.rs`, 本 crate 不复制第二份。
# 与 `.als` 不同, `yeban-render` 侧的这个 feature **没有可选依赖**, 因此默认依赖图
# (默认 `cargo tree -p yeban-app -e normal --locked` 的逐包集合) **一位不变**。
experimental-logic-export = ["yeban-render/experimental-logic-export"]

# `experimental-logic-import`: Logic Pro `.logicx` 的**只读读取 + 真导入**转发开关
# (`[ARCH-FMT-002]` / #143 / #149)。
#
# **不在 `default` 里** —— AGENTS.md §2 红线 6 与 `scripts/guards/policy_check.py` 的
# `FORBIDDEN_DEFAULT_FEATURES` 都要点名这个特性。它把 `yeban-render` 那一边的同名
# feature 转发开: 字节读取器住在 `yeban-render/src/logic_read.rs`, 本 crate 不复制
# 第二份解析器; 建 `YebanProjectV1` 与落盘住在本 crate 的 `src/import_logic.rs`。
# 两个开关共用这一个 feature:
#   * `--inspect-logic <dir>`:**只读探针**, 不写工程、不产出 `.yeban`;
#   * `--import-logic <demo> --save-as <out.yeban>`:**真导入**, 只写 `--save-as`。
# 默认构建里这两个开关都是**一次点名 feature 的用法错误** (退出码 2),
# 绝不静默忽略 —— 见 `ParseError::InspectLogicNotCompiled` /
# `ParseError::ImportLogicNotCompiled`。
experimental-logic-import = ["yeban-render/experimental-logic-import"]

# ---------------------------------------------------------------------------
# dev-dependencies: 让真实界面的 Tier-1 判据**真的被执行**
# ---------------------------------------------------------------------------
# 为什么需要这一条 (实测, 不是偏好):
#   1. `src/test_port_adapter.rs` 同时是 `[[test]] test_port_adapter` 的源码, 而那个目标
#      挂在 `required-features = ["ui-test-port"]` 后面 —— 该 feature 默认关闭,
#      且 CI 目前没有任何一步启用它 (集成者按纪律暂时移除了那一步);
#   2. 后果: 那条判据**从未被编译过**。commit 66b002c / run 37223586792 的实测是
#      `cargo test -p yeban-app --features ui-test-port` 直接编译失败 (8 处错误);
#   3. 于是新增 `tests/real_ui_tier1.rs`: 一个**自动发现**的集成测试目标,
#      `cargo test -p yeban-app --all-targets` 一定会跑它。它用 `#[path]` 引入同一份判据源码,
#      依赖只可能来自这里。
#
# 为什么不违反"内省能力不进默认构建" (AGENTS.md §2 红线 6 的精神):
#   dev-dependencies **只**参与 test/example/bench 目标的构建, 不参与 `cargo build`
#   (含 `--release`)。核验命令 (零编译):
#       cargo tree -p yeban-app -e normal --locked     # 不应出现 yeban-ui-test-port
#
# 与上面那个 optional 依赖的关系: 同一个包在两个 dep 段里各出现一次是 Cargo 支持的写法
# (feature 仍能把它拉进 lib/bin 的构建图; 这里只是让测试目标无论如何都拿得到它)。
[dev-dependencies]
yeban-ui-test-port = { path = "../yeban-ui-test-port" }

# ---------------------------------------------------------------------------
# ui-mcp: UI 控制面 —— **只**在测试目标里接线 (live-port 工作线)
# ---------------------------------------------------------------------------
# 为什么是 dev-dependency 而不是普通依赖 —— 这是**红线 6** 的直接后果
# (AGENTS.md §2 红线 6 / MUST-GATE-009: 官方默认 release 构建中严禁默认开启
#  `mcp-http` / `ui-mcp`)。真实接线代码住在 `src/live_surface.rs`: 它只在测试目标里
# 被 `#[path]` 装进去 (与 `src/test_port_adapter.rs` 同款做法), 因此
# `cargo build -p yeban-app` (含 `--release`) 的依赖图里**没有** yeban-ui-mcp。
# 核验命令 (零编译, 本机可跑):
#     cargo tree -p yeban-app -e normal --locked       # 不应出现 yeban-ui-mcp
#     cargo tree -p yeban-app -e dev,normal --locked   # 测试目标里应当出现
#
# 依赖方向: yeban-app --(dev)--> yeban-ui-mcp --> yeban-ui-test-port。
# **不反向** (yeban-ui-mcp 绝不依赖 yeban-app, 否则成环): 因此"拿像素"的能力由
# yeban-ui-mcp 的 `PortAdapter` 以**闭包/函数指针**的形式注入, 见 ui-mcp 的
# `docs/ledger/ui-mcp-notes.md` §8 needs-3。
#
# 不写 version 的理由同 `yeban-ui-test-port` (ADR-0001 D5/D21: 成员间 path 依赖)。
yeban-ui-mcp = { path = "../yeban-ui-mcp" }

# 无头控件树断言 + Tier-1 截图比对。**不放进 default**:
# 一个 `[[test]]` 目标 (src/test_port_adapter.rs) 通过 `required-features` 挂在它后面。
[[test]]
name = "test_port_adapter"
path = "src/test_port_adapter.rs"
required-features = ["ui-test-port"]

[build-dependencies]
# slint-build 的 `compat-1-18` 是**强制特性**: 缺了它 crate 自己会 compile_error!。
# 根里 default-features = false 关掉了它, 所以这里必须补回来。
# 出处: https://docs.rs/slint-build/1.18.1/slint_build/ 的 "Feature flags" 一节,
#       以及 slint-build-1.18.1 源码 src/lib.rs:53-57 的 compile_error! 分支。
slint-build = { workspace = true, features = ["compat-1-18"] }

[lints]
workspace = true
