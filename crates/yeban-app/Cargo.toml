[package]
name = "yeban-app"
description = "Slint GUI 主程序与桌面窗口宿主 (内嵌 MCP 服务)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "yeban_app"
path = "src/lib.rs"

[[bin]]
name = "yeban-app"
path = "src/main.rs"

[dependencies]
yeban-midi = { path = "../yeban-midi" }
# 版本唯一事实源仍是根 Cargo.toml 的 [workspace.dependencies] (ADR-0001 D5) —— 本文件不写版本号。
# 根里 slint 被钉成 `default-features = false`, 因此**必要 feature 必须在成员这一层显式列出**。
# 核验来源 (2026-10-05, docs.rs):
#   slint 1.18.1 feature 表  https://docs.rs/crate/slint/1.18.1/features
#     - std / compat-1-2 / accessibility / renderer-femtovg / renderer-software 都在默认集里,
#       但 default-features = false 会把它们全部关掉, 所以这里逐个补回;
#     - backend-default 是"选后端"的开关, 转发到 i-slint-backend-selector/default。
#   转发链  https://docs.rs/crate/i-slint-backend-selector/1.18.1/features
#     i-slint-backend-selector/default -> backend-winit -> backend-winit-wayland + backend-winit-x11
#   因此不需要再手写 backend-winit / backend-winit-x11 / backend-winit-wayland。
# 注意: 不启用 renderer-skia —— 规范 §12.1 提到的 Skia 软件后端会拖入 LLVM/clang,
#       与"本机不跑高耗 CPU 任务"的纪律冲突; 可移植的 renderer-software 已足够做无头兜底。
slint = { workspace = true, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-default",
    "renderer-femtovg",
    "renderer-software",
] }

# 界面**不再渲染硬编码的演示数据** —— 它由 `YebanProjectV1` 经 `src/bridge.rs` 的投影层驱动
# (见 docs/ledger/app-binding-notes.md)。因此 app 需要权威数据模型 crate。
# 依赖方向: 架构规范 §8 的 crate 清单 = yeban-app --> yeban-model (与 slint 一样单向)。
# 只写 `{ workspace = true }`, **不写 version** —— 根 `[workspace.dependencies]` 是版本唯一
# 事实源 (ADR-0001 D5); 成员间 path 依赖的通配豁免见 ADR-0001 **D21**。
# 红线 3 不受影响: 它约束的是**引擎层** crate 不得引入 GUI; 反向 (GUI 依赖模型) 正是规范要求的形态。
yeban-model = { workspace = true }

# ---------------------------------------------------------------------------
# yeban-render: SMF (MIDI) 导出的**唯一**编码器, app-export-midi 工作线
# ---------------------------------------------------------------------------
# 为什么 app 需要它: ADR-0001 **D47** 的裁决是"MIDI 导出的唯一出口 = app CLI
# `--export-midi`"(不扩 `yeban_render_master` 的 format 参数)。而 SMF 的编码器只有一份
# ——`crates/yeban-render/src/midi.rs`(含 `midly` 编码 + 自研 VLQ/chunk 字节级核对)。
# 因此 app 侧**只**做"工程 → `MidiExport`"的映射(`src/export_midi.rs`), 字节由那一个
# 编码器产出; 在这里再写一份编码器是明令禁止的。
#
# 这是一条**工作区内**依赖边(D51): 没有引入任何新的外部 crate —— `yeban-render` 早已
# 是 workspace 成员, 它的 `midly`/`rayon`/`hound` 早已在 `Cargo.lock` 里。它给
# `Cargo.lock` 带来的变化只有 `yeban-app` 依赖列表里的一行(由 `cargo metadata` 机械生成,
# 见 docs/ledger/app-export-midi-notes.md §6 的原始 diff)。
# 只写 `{ workspace = true }`, 不写 version(ADR-0001 D5/D21)。
yeban-render = { workspace = true }

# ---------------------------------------------------------------------------
# yeban-engine: 实时引擎的**只读消费面** (电平 SPSC + 快照), app-mixer 工作线
# ---------------------------------------------------------------------------
# 为什么 app 需要它: `[ARCH-UI-002]` 要求"实时线程以 60Hz 向无锁 Meter SPSC 压入真峰值
# 与 RMS, UI 线程定时器批量出队更新 Slint Properties"。生产侧 (`MeterBank` /
# `MeterCollector::drain_latest` / `MeterBoard` / `supersedes`) 已在 `yeban-engine` 落地
# (见 docs/ledger/engine-meters-notes.md), **消费者**只能是持有 UI 线程的那一侧 ——
# 也就是本 crate。app 侧**不另造队列**: `meter_channel()` 建的 SPSC 由引擎提供,
# UI 只持消费端 (`src/meters.rs`)。
#
# 为什么用**默认 feature** (ADR-0001 D19): 本 crate 未来要宿主声卡 (cpal),
# 而 D19 的裁决是"引擎把设备 I/O 用 feature 隔开, 需要设备的消费者用默认 feature"。
# **不在 app 里引 cpal 的裸类型**: `src/engine_host.rs` 只用 `EngineSnapshot` /
# `EngineRuntime` / `meter_channel` 这些与设备无关的公开面, 一个 `cpal::*` 都不出现
# (D19 的字面要求)。离线渲染器 `yeban-render` 走的是另一条路
# (`default-features = false`), 与本条无关。
yeban-engine = { workspace = true }
# [D56] 诊断包: UI 与 MCP 调**同一个** `export_diagnostics`。
yeban-diagnostics = { path = "../yeban-diagnostics" }

# ---------------------------------------------------------------------------
# ui-test-port: 无头 UI 自动化测试端口 (默认**关闭**)
# ---------------------------------------------------------------------------
# 依赖方向 (架构规范 §8 的 crate 清单): yeban-app --(feature)--> yeban-ui-test-port。
# 反向依赖会成环, 所以控件树的**数据模型**住在 test-port 侧, 适配器住在 app 侧
# (src/test_port_adapter.rs)。
#
# 为什么默认关闭: `AGENTS.md` §2 红线 6 的精神是"测试/内省能力不进默认构建"。
# 本 crate 的测试端口会把 Slint 的 Testing Backend (官方**内部** crate) 拉进依赖图,
# 而 release 二进制不需要它。因此它只能被显式 `--features ui-test-port` 打开。
# 只写 `path`(+`optional`), **不写 version** —— 成员清单里不出现版本号是本仓库的规则
# (ADR-0001 D5: 版本唯一事实源是根 `[workspace.dependencies]`)。
#
# 注意: Cargo 会给这种依赖隐式补一个 `*` 版本需求, 而 `deny.toml` 的
# `[bans] wildcards = "deny"` 默认会因此报 `error[wildcard]`(实测踩过: CI run 37221429630)。
# 这条现在由 ADR-0001 **D21** 的 `[bans] allow-wildcard-paths = true` 豁免 ——
# 该豁免只放行"带 path 的 `*`", registry 依赖仍必须写真实版本。需要真正发布本 crate 时,
# 再由集成者把它连同版本一起登记进根 `[workspace.dependencies]`。
yeban-ui-test-port = { path = "../yeban-ui-test-port", optional = true }

[features]
# `dep:` 语法: 只暴露 feature 名, 不额外产生一个同名隐式 feature。
ui-test-port = ["dep:yeban-ui-test-port"]

# ---------------------------------------------------------------------------
# dev-dependencies: 让真实界面的 Tier-1 判据**真的被执行**
# ---------------------------------------------------------------------------
# 为什么需要这一条 (实测, 不是偏好):
#   1. `src/test_port_adapter.rs` 同时是 `[[test]] test_port_adapter` 的源码, 而那个目标
#      挂在 `required-features = ["ui-test-port"]` 后面 —— 该 feature 默认关闭,
#      且 CI 目前没有任何一步启用它 (集成者按纪律暂时移除了那一步);
#   2. 后果: 那条判据**从未被编译过**。commit 66b002c / run 37223586792 的实测是
#      `cargo test -p yeban-app --features ui-test-port` 直接编译失败 (8 处错误);
#   3. 于是新增 `tests/real_ui_tier1.rs`: 一个**自动发现**的集成测试目标,
#      `cargo test -p yeban-app --all-targets` 一定会跑它。它用 `#[path]` 引入同一份判据源码,
#      依赖只可能来自这里。
#
# 为什么不违反"内省能力不进默认构建" (AGENTS.md §2 红线 6 的精神):
#   dev-dependencies **只**参与 test/example/bench 目标的构建, 不参与 `cargo build`
#   (含 `--release`)。核验命令 (零编译):
#       cargo tree -p yeban-app -e normal --locked     # 不应出现 yeban-ui-test-port
#
# 与上面那个 optional 依赖的关系: 同一个包在两个 dep 段里各出现一次是 Cargo 支持的写法
# (feature 仍能把它拉进 lib/bin 的构建图; 这里只是让测试目标无论如何都拿得到它)。
[dev-dependencies]
yeban-ui-test-port = { path = "../yeban-ui-test-port" }

# ---------------------------------------------------------------------------
# ui-mcp: UI 控制面 —— **只**在测试目标里接线 (live-port 工作线)
# ---------------------------------------------------------------------------
# 为什么是 dev-dependency 而不是普通依赖 —— 这是**红线 6** 的直接后果
# (AGENTS.md §2 红线 6 / MUST-GATE-009: 官方默认 release 构建中严禁默认开启
#  `mcp-http` / `ui-mcp`)。真实接线代码住在 `src/live_surface.rs`: 它只在测试目标里
# 被 `#[path]` 装进去 (与 `src/test_port_adapter.rs` 同款做法), 因此
# `cargo build -p yeban-app` (含 `--release`) 的依赖图里**没有** yeban-ui-mcp。
# 核验命令 (零编译, 本机可跑):
#     cargo tree -p yeban-app -e normal --locked       # 不应出现 yeban-ui-mcp
#     cargo tree -p yeban-app -e dev,normal --locked   # 测试目标里应当出现
#
# 依赖方向: yeban-app --(dev)--> yeban-ui-mcp --> yeban-ui-test-port。
# **不反向** (yeban-ui-mcp 绝不依赖 yeban-app, 否则成环): 因此"拿像素"的能力由
# yeban-ui-mcp 的 `PortAdapter` 以**闭包/函数指针**的形式注入, 见 ui-mcp 的
# `docs/ledger/ui-mcp-notes.md` §8 needs-3。
#
# 不写 version 的理由同 `yeban-ui-test-port` (ADR-0001 D5/D21: 成员间 path 依赖)。
yeban-ui-mcp = { path = "../yeban-ui-mcp" }

# 无头控件树断言 + Tier-1 截图比对。**不放进 default**:
# 一个 `[[test]]` 目标 (src/test_port_adapter.rs) 通过 `required-features` 挂在它后面。
[[test]]
name = "test_port_adapter"
path = "src/test_port_adapter.rs"
required-features = ["ui-test-port"]

[build-dependencies]
# slint-build 的 `compat-1-18` 是**强制特性**: 缺了它 crate 自己会 compile_error!。
# 根里 default-features = false 关掉了它, 所以这里必须补回来。
# 出处: https://docs.rs/slint-build/1.18.1/slint_build/ 的 "Feature flags" 一节,
#       以及 slint-build-1.18.1 源码 src/lib.rs:53-57 的 compile_error! 分支。
slint-build = { workspace = true, features = ["compat-1-18"] }

[lints]
workspace = true
